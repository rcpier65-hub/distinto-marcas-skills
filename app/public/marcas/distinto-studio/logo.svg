<svg width="90" height="85" viewBox="0 0 90 85" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Isotipo Distinto Studio (proporciones fieles al logo original).
       Burbuja casi circular punteada + círculo sólido del mismo tamaño.
       El círculo cubre el lado izquierdo de la burbuja. -->

  <!-- Burbuja punteada: casi circular, cola pequeña abajo-izquierda -->
  <path d="M54 13
           C70 13 84 25 84 42
           C84 59 70 71 54 71
           C47 71 42 74 36 82
           C37 74 38 70 37 68
           C25 65 24 54 24 42
           C24 25 38 13 54 13 Z"
        fill="none"
        stroke="#4ADE80"
        stroke-width="4"
        stroke-linecap="round"
        stroke-dasharray="0.1 8.5"/>

  <!-- Círculo sólido: mismo radio, superpone lado izquierdo de la burbuja -->
  <circle cx="24" cy="42" r="22" fill="#4ADE80"/>
</svg>
