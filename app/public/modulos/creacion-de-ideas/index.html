<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Distinto Studio · Estudio de Contenido</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --radius:16px; --radius-sm:11px;
  --font-display:'Poppins',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.25);
}
/* DISTINTO STUDIO — navy #132D46 + verde #4ADE80 */
:root[data-theme="neon"]{
  --bg:#0b1b29; --bg2:#0e2233; --surface:#132d46; --surface2:#17364f; --surface3:#1e415d;
  --line:#264a67; --text:#eff5fb; --muted:#90a9bd; --faint:#5f7d95;
  --accent:#4ade80; --accent-ink:#0b1b29; --accent-soft:rgba(74,222,128,.15);
  --accent2:#7bd0ff; --danger:#ff6b6b; --gold:#f2cc2c;
}
/* DISTINTO AGENCIA — morado #BA41F7 + amarillo #F2CC2C */
:root[data-theme="cozy"]{
  --bg:#150a22; --bg2:#1b0f2c; --surface:#231338; --surface2:#2b1945; --surface3:#341e54;
  --line:#3d2560; --text:#f3edfb; --muted:#a892c4; --faint:#6e5690;
  --accent:#ba41f7; --accent-ink:#ffffff; --accent-soft:rgba(186,65,247,.16);
  --accent2:#f2cc2c; --danger:#ff6b6b; --gold:#f2cc2c;
}
/* SISTEMA DISTINTO — claro, tokens de la app (fondo blanco/#fafafa + acento #7170ff) */
:root[data-theme="distinto"]{
  --bg:#fafafa; --bg2:#ffffff; --surface:#ffffff; --surface2:#f6f6f8; --surface3:#eeeef1;
  --line:rgba(10,10,10,.10); --text:#0a0a0a; --muted:rgba(10,10,10,.60); --faint:rgba(10,10,10,.42);
  --accent:#7170ff; --accent-ink:#ffffff; --accent-soft:rgba(113,112,255,.12);
  --accent2:#a78bff; --danger:#ef4444; --gold:#f59e0b;
  --shadow:0 8px 24px rgba(10,10,10,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg); color:var(--text); font-family:var(--font-body); -webkit-font-smoothing:antialiased; font-size:15px; line-height:1.5}
h1,h2,h3,h4{font-family:var(--font-display); margin:0; line-height:1.12; letter-spacing:-.01em}
button{font-family:inherit; cursor:pointer}
a{color:inherit}
::selection{background:var(--accent); color:var(--accent-ink)}
input,select,textarea{font-family:inherit}

.btn{border:1px solid var(--line); background:var(--surface2); color:var(--text); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:8px; transition:.15s; white-space:nowrap}
.btn:hover{border-color:var(--faint); transform:translateY(-1px)}
.btn.accent{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.btn.accent:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 12px; font-size:13px}
.btn.block{width:100%; justify-content:center}
.chip{border:1px solid var(--line); background:var(--surface2); padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; display:inline-flex; gap:7px; align-items:center; transition:.15s; color:var(--text)}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px}
select,input.fld,textarea.fld{background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:10px 12px; font-size:14px}
select:focus,input.fld:focus,textarea.fld:focus{outline:none; border-color:var(--accent)}

.topbar{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--bg) 88%, transparent); backdrop-filter:blur(12px); border-bottom:1px solid var(--line)}
.topbar-inner{max-width:1440px; margin:0 auto; padding:0 22px; height:62px; display:flex; align-items:center; gap:16px}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-weight:800; font-size:19px; letter-spacing:-.02em; white-space:nowrap}
.brand .spark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink); display:grid;place-items:center;font-size:17px;box-shadow:0 0 0 4px var(--accent-soft)}
.nav{display:flex; gap:2px; margin-left:6px; flex:1; overflow:auto; scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px; border-radius:10px; font-weight:600; font-size:14px; color:var(--muted); text-decoration:none; white-space:nowrap}
.nav a:hover{color:var(--text); background:var(--surface2)}
.nav a.active{color:var(--text); background:var(--surface2)}
.nav a.active .u{display:block; height:2px; background:var(--accent); border-radius:2px; margin-top:5px}
.nav a .u{display:none}
.top-actions{display:flex; align-items:center; gap:9px}
.avatar{width:36px;height:36px;border-radius:50%; background:var(--surface3); display:grid; place-items:center; font-size:18px; border:1px solid var(--line)}

.shell{max-width:1440px; margin:0 auto; padding:22px; display:grid; gap:20px; grid-template-columns:264px minmax(0,1fr) 300px}
.shell.no-rail{grid-template-columns:264px minmax(0,1fr)}
.shell.full{grid-template-columns:minmax(0,1fr)}
@media(max-width:1180px){ .shell,.shell.no-rail{grid-template-columns:1fr} .rail,.sidebar{display:none} }

.sidebar,.rail{display:flex; flex-direction:column; gap:16px}
.side-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px}
.side-title{font-size:12px; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); font-weight:700}
.plan-name{font-family:var(--font-display); font-weight:800; font-size:22px; margin-top:2px}
.streak-card{text-align:center}
.mascot{font-size:52px; line-height:1; filter:drop-shadow(0 6px 14px rgba(0,0,0,.25))}
.streak-num{font-family:var(--font-display); font-weight:800; font-size:28px; margin-top:8px}
.streak-num small{color:var(--accent)}

/* xp bar */
.xpbar{height:9px; background:var(--surface3); border-radius:999px; overflow:hidden; margin-top:8px}
.xpbar>i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px}
.lvl{display:inline-grid; place-items:center; width:34px;height:34px;border-radius:10px;background:var(--accent-soft); color:var(--text); font-weight:800; font-family:var(--font-display)}

.rings{display:flex; gap:16px; align-items:center; justify-content:center; flex-wrap:wrap}
.ring{--v:0; width:76px;height:76px;border-radius:50%; display:grid; place-items:center; position:relative; background:conic-gradient(var(--rc) calc(var(--v)*1%), var(--surface3) 0)}
.ring::before{content:""; position:absolute; inset:9px; border-radius:50%; background:var(--surface)}
.ring b{position:relative; font-size:22px}
.ring span{position:absolute; bottom:-20px; font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap}

.greet{display:flex; align-items:center; gap:16px; margin-bottom:6px}
.greet .m{font-size:44px}
.greet h1{font-size:32px}
.pill{display:inline-flex; gap:7px; align-items:center; background:var(--accent-soft); color:var(--text); border:1px solid var(--line); padding:6px 13px; border-radius:999px; font-size:13px; font-weight:600; margin-top:6px}
.composer{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.composer .q{color:var(--muted); font-size:15px; margin-bottom:12px}
.composer .row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:12px}
.inputbar{display:flex; gap:10px; align-items:center}
.inputbar input,.inputbar textarea{flex:1; background:var(--surface2); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:14px 16px; font-size:15px; font-family:inherit; resize:none}
.inputbar input:focus,.inputbar textarea:focus{outline:none; border-color:var(--accent)}

/* stat tiles */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-top:18px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px}
.stat b{font-family:var(--font-display); font-size:28px; display:block}
.stat span{color:var(--muted); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.05em}

.check{display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--line)}
.check:first-child{border-top:none}
.check .box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line); display:grid; place-items:center; flex:none}
.check.done .box{background:var(--accent); border-color:transparent; color:var(--accent-ink)}
.check.done .lbl{color:var(--muted); text-decoration:line-through}
.xp{margin-left:auto; font-size:12px; color:var(--accent); font-weight:700}

.grid{display:grid; gap:14px}
.grid.g2{grid-template-columns:repeat(2,1fr)}
.grid.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.grid.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:640px){.grid.g2,.grid.g3{grid-template-columns:1fr}}
.idea-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:15px; display:flex; flex-direction:column; gap:9px; position:relative}
.tag{align-self:flex-start; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; padding:3px 9px; border-radius:999px; background:var(--accent-soft); color:var(--text)}
.star{position:absolute; top:12px; right:12px; font-size:18px; opacity:.5; cursor:pointer; background:none; border:none}
.star.on{opacity:1}

.step{border:1px solid var(--line); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:10px; background:var(--surface2)}
.step .k{display:flex; align-items:center; gap:10px; margin-bottom:7px}
.step .k b{width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800}
.step .k .nm{font-weight:700; font-family:var(--font-display)}
.step .k .pp{color:var(--muted); font-size:12px}
.step .k .rg{margin-left:auto; background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);padding:3px 8px;font-size:12px;cursor:pointer}
.step .k .rg:hover{color:var(--text);border-color:var(--accent)}
.step .tx{outline:none}
.step .tx:focus{background:var(--surface3); border-radius:6px}

.head{display:flex; align-items:center; gap:14px; margin-bottom:16px; flex-wrap:wrap}
.head h2{font-size:26px}
.head .sp{flex:1}
.eyebrow{font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:700}
.empty{text-align:center; color:var(--muted); padding:40px 20px}
.empty .m{font-size:44px; margin-bottom:6px}

.tabs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px}
.tab{border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600; color:var(--muted)}
.tab.on{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.badge{font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; padding:3px 8px; border-radius:999px; border:1px solid var(--line)}
.badge.borrador{color:var(--muted)}
.badge.listo{color:var(--accent2); border-color:var(--accent2)}
.badge.grabado{color:var(--gold); border-color:var(--gold)}
.badge.publicado{color:var(--accent-ink); background:var(--accent); border-color:transparent}

.week{display:grid; grid-template-columns:repeat(7,1fr); gap:10px}
@media(max-width:760px){.week{grid-template-columns:repeat(2,1fr)}}
.day{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); padding:12px; min-height:150px; display:flex; flex-direction:column; gap:8px}
.day.today{border-color:var(--accent)}
.day .dn{font-size:12px; color:var(--muted); font-weight:700; text-transform:uppercase; display:flex; justify-content:space-between}
.day .slot{background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:8px; font-size:12px; display:flex; gap:6px; align-items:flex-start}
.day .add{margin-top:auto; border:1px dashed var(--line); background:none; color:var(--muted); border-radius:9px; padding:7px; font-size:12px; cursor:pointer}
.day .add:hover{border-color:var(--accent); color:var(--text)}
.goal{display:flex; align-items:center; gap:12px; margin-bottom:14px}
.goal .bar{flex:1; height:10px; background:var(--surface3); border-radius:999px; overflow:hidden}
.goal .bar>i{display:block;height:100%; background:var(--accent); border-radius:999px}

.tp-overlay{position:fixed; inset:0; z-index:100; background:#000; color:#fff; display:none; flex-direction:column}
.tp-overlay.on{display:flex}
.tp-scroll{flex:1; overflow:hidden; position:relative}
.tp-text{position:absolute; left:0; right:0; padding:0 8vw; font-family:var(--font-display); font-weight:700; text-align:center; will-change:transform}
.tp-bar{display:flex; gap:12px; align-items:center; justify-content:center; padding:14px; background:#0c0c0c; border-top:1px solid #222; flex-wrap:wrap}
.tp-bar input[type=range]{accent-color:var(--accent)}

.mini-week{display:grid; grid-template-columns:repeat(7,1fr); gap:5px; text-align:center; margin-top:10px}
.mini-week div{padding:7px 0; border-radius:9px; font-size:12px; font-weight:700; background:var(--surface2); color:var(--muted)}
.mini-week div.on{background:var(--accent); color:var(--accent-ink)}

.plan-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px}
@media(max-width:640px){.plan-grid{grid-template-columns:1fr}}
.plan-col{border:1px solid var(--line); border-radius:var(--radius); padding:18px}
.plan-col.pro{border-color:var(--accent)}
.plan-col li{list-style:none; padding:6px 0; font-size:14px; display:flex; gap:8px}
.plan-col ul{padding:0; margin:12px 0 0}

.moodgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px}
@media(max-width:900px){.moodgrid{grid-template-columns:repeat(2,1fr)}}
.moodgrid .cap{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-sm); overflow:hidden}
.moodgrid .cap img{width:100%; display:block; aspect-ratio:1; object-fit:cover}
.moodgrid .cap .n{padding:10px; font-size:13px}

.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0; background:var(--text); color:var(--bg); padding:12px 20px; border-radius:999px; font-weight:600; z-index:200; transition:.25s; pointer-events:none}
.toast.on{opacity:1; transform:translateX(-50%) translateY(0)}
.foot{max-width:1440px;margin:10px auto 30px;padding:0 22px;color:var(--faint);font-size:12px}
.row{display:flex; gap:10px; flex-wrap:wrap}
/* chat */
.chat{display:flex; flex-direction:column; gap:12px; max-height:56vh; overflow:auto; padding:4px 2px 12px}
.bub{max-width:84%; padding:12px 15px; border-radius:16px; font-size:14px; line-height:1.5}
.bub.bot{align-self:flex-start; background:var(--surface2); border:1px solid var(--line); border-bottom-left-radius:5px}
.bub.user{align-self:flex-end; background:var(--accent); color:var(--accent-ink); border-bottom-right-radius:5px; font-weight:600}
.bub .acts{display:flex; gap:8px; flex-wrap:wrap; margin-top:10px}
.teaser{align-self:flex-start; max-width:84%; background:var(--accent-soft); border:1px solid var(--line); border-radius:14px; padding:12px 15px; font-size:14px; line-height:1.55}
.chatcomposer{margin-top:14px}
</style>
</head>
<body>
<div id="root"></div>
<div class="tp-overlay" id="tp">
  <div class="tp-scroll"><div class="tp-text" id="tpText"></div></div>
  <div class="tp-bar">
    <button class="btn sm" onclick="TP.toggle()"><span id="tpPlay">⏸ Pausa</span></button>
    <label style="font-size:13px">Velocidad <input type="range" id="tpSpeed" min="10" max="140" value="55"></label>
    <label style="font-size:13px">Tamaño <input type="range" id="tpSize" min="28" max="92" value="52"></label>
    <button class="btn sm" onclick="TP.close()">✕ Cerrar</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const BRAND = { name:'Distinto Studio', mascot:'✦' };
const NICHES=['marketing','fitness','comida','belleza','inmobiliaria','educacion','ecommerce','finanzas','viajes','tecnologia','emprendimiento','mascotas'];
const PLATFORMS=['TikTok','Reels','Shorts'];
const GOALS=['Que me sigan','Que guarden','Que compren','Que comenten'];
const STATES=['borrador','listo','grabado','publicado'];
const WEEK_GOAL=5;

/* ---------- DATA (motor de contenido) ---------- */
const DATA = {
  ideas: [
    {niche:'marketing', idea:'Auditar en vivo el perfil de un negocio local y mostrar 3 cambios que traen más mensajes.', hook:'Le arreglé el perfil a esta cafetería en 60 segundos y le llegaron 40 mensajes.'},
    {niche:'marketing', idea:'Pantalla dividida: un caption aburrido vs el mismo con gancho. Explica por qué retiene.', hook:'Este caption te está costando clientes y ni te has dado cuenta.'},
    {niche:'fitness', idea:'3 ejercicios que casi todos hacen mal y la corrección al lado.', hook:'Llevas 6 meses haciendo esto mal y por eso no crece.'},
    {niche:'fitness', idea:'Arma un día de comida alta en proteína con presupuesto ajustado desde el mercado.', hook:'Comí como fisicoculturista con 30 soles: esto compré.'},
    {niche:'comida', idea:'Lomo saltado en 6 minutos con lo que ya hay en el refri.', hook:'Lomo saltado en 6 minutos con lo que ya tienes en tu refri.'},
    {niche:'comida', idea:'3 errores que arruinan tu arroz y la forma correcta al lado.', hook:'Deja de arruinar tu arroz: cometes estos 3 errores.'},
    {niche:'belleza', idea:'Rutina de skincare de 3 productos para piel grasa en clima húmedo.', hook:'3 productos y adiós cara brillosa a mediodía.'},
    {niche:'belleza', idea:'Aplicar corrector sin que se cuartee: el paso que casi todos se saltan.', hook:'Tu corrector se cuartea por este paso que te saltas.'},
    {niche:'inmobiliaria', idea:'Tour de un depa señalando lo que nadie te dice antes de comprar.', hook:'Vi 20 depas y este error lo cometen casi todos.'},
    {niche:'inmobiliaria', idea:'Con números reales, cuánto necesitas de cuota inicial (es menos de lo que crees).', hook:'Necesitas menos inicial de la que crees: te muestro los números.'},
    {niche:'educacion', idea:'La técnica Feynman: enseñar un tema como si se lo contaras a un niño.', hook:'Estudia la mitad y aprende el doble con este método.'},
    {niche:'educacion', idea:'3 apps gratis que reemplazan a un profesor particular, con demo de cada una.', hook:'Estas 3 apps gratis me subieron las notas sin gastar un sol.'},
    {niche:'ecommerce', idea:'Empaque satisfactorio de un pedido: por qué un buen unboxing te da publicidad gratis.', hook:'Empaco así y mis clientes me hacen publicidad gratis.'},
    {niche:'ecommerce', idea:'Fotos de producto profesionales con el celular, una caja y luz de ventana.', hook:'Fotos de producto que venden con tu celu y una caja de cartón.'},
    {niche:'finanzas', idea:'Reto de ahorro de 52 semanas con un frasco: empieza con 1 sol y sube cada semana.', hook:'Empieza con 1 sol esta semana y ten 1,378 a fin de año.'},
    {niche:'finanzas', idea:'3 gastos hormiga y cuánto suman al año en pantalla.', hook:'Ese gasto de 5 soles al día te cuesta 1,800 al año.'},
    {niche:'viajes', idea:'Escapada de fin de semana con presupuesto exacto: transporte, comida y dónde dormir.', hook:'Escapada de fin de semana por 120 soles, todo incluido.'},
    {niche:'viajes', idea:'Buscar vuelos en pantalla: fechas flexibles, incógnito y comparador, bajando el precio.', hook:'Bajé mi vuelo de 400 a 180 soles en 2 minutos, mira.'},
    {niche:'tecnologia', idea:'3 funciones ocultas del celular que casi nadie usa, demostrando cada una.', hook:'Tu celular hace esto y no tenías ni idea.'},
    {niche:'tecnologia', idea:'Resolver una tarea aburrida con IA en 30 segundos, mostrando el prompt exacto.', hook:'Le pedí esto a la IA y me ahorró 3 horas de trabajo.'},
    {niche:'emprendimiento', idea:'El error que quiebra al 90% de negocios nuevos en 6 meses, con ejemplo.', hook:'El 90% quiebra por este error: no lo cometas tú.'},
    {niche:'emprendimiento', idea:'Validar una idea de negocio en 1 día con una prueba simple antes de invertir.', hook:'No inviertas sin hacer antes esta prueba de 1 día.'},
    {niche:'mascotas', idea:'3 alimentos de casa que son veneno para el perro, con imágenes claras.', hook:'Esto que le das a tu perro lo puede matar.'},
    {niche:'mascotas', idea:'Señales de que tu gato te quiere, con clips de un gato haciéndolas.', hook:'Si tu gato hace esto, te ama de verdad.'},
  ],
  framework: { steps: [
    {key:'V', name:'Verbal', purpose:'Gancho hablado (primeros 3s)', templates:[
      'Si todavía haces {idea} de esta forma, para todo y escucha esto.',
      'Nadie te lo dice en la cara, pero {idea} es lo que te está frenando.',
      'Deja de hacer {idea} mal, te está costando {beneficio} sin que te des cuenta.']},
    {key:'I', name:'Imán', purpose:'Retención / promesa', templates:[
      'Quédate hasta el final, porque el último paso es el que de verdad te da {beneficio}.',
      'En menos de un minuto te muestro cómo {idea} sin complicarte.',
      'Te doy los 3 pasos exactos, y el número 2 casi nadie lo hace.']},
    {key:'R', name:'Respaldo', purpose:'Prueba / credibilidad', templates:[

});

function load(){ try{ return deepDefaults(defaults(), JSON.parse(localStorage.getItem(KEY))||{}); }catch(e){ return defaults(); } }
function deepDefaults(d,s){ const o=Object.assign({},d,s); for(const k in d){ if(d[k]&&typeof d[k]==='object'&&!Array.isArray(d[k])) o[k]=Object.assign({},d[k],s[k]||{}); } return o; }

const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const jsq=s=>(s||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),1900); }
function addXP(n){ S.xp+=n; save(); }

function todayIdx(){ let d=new Date().getDay(); return (d+6)%7; }
const LEVELS=[0,100,250,500,900,1400,2000];
function levelInfo(xp){ let lv=1; for(let i=0;i<LEVELS.length;i++){ if(xp>=LEVELS[i]) lv=i+1; } const base=LEVELS[lv-1]||0; const next=LEVELS[lv]||(base+700); return {lv, into:xp-base, need:next-base, pct:Math.min(100,Math.round((xp-base)/(next-base)*100))}; }
function words(sc){ return sc.steps.reduce((n,s)=>n+(s.text||'').split(/\s+/).length,0); }
function durSec(sc){ return Math.max(8, Math.round(words(sc)/2.6)); }

/* ---------- GENERADOR (placeholder; IA real en fase 2) ---------- */
const shorten = s => { s=(s||'').split(/[.:]/)[0].trim(); return s.length>66? s.slice(0,66).trim()+'…' : s; };
const lower = s => s? s.charAt(0).toLowerCase()+s.slice(1) : s;
const cap = s => s? s.charAt(0).toUpperCase()+s.slice(1) : s;
const AT = {
  'Error común': t=>`El error que casi todos cometen con ${lower(t)}`,
  'Antes/Después': t=>`Antes vs después: ${lower(t)}`,
  'Mito': t=>`Mentira lo que crees sobre ${lower(t)}`,
  'Tutorial rápido': t=>`${cap(t)}, en 3 pasos rápidos`,
  'Historia personal': t=>`El día que entendí ${lower(t)}`,
  'Lista': t=>`5 claves sobre ${lower(t)}`,
  'Contraintuitivo': t=>`Deja de hacer ${lower(t)} (en serio)`,
  'Detrás de cámara': t=>`Cómo hago ${lower(t)} de verdad, sin filtro`,
  'Comparación': t=>`${cap(t)}: ¿cuál gana?`,
  'Predicción': t=>`Si sigues así con ${lower(t)}, esto va a pasar`,
  'Reto': t=>`Reto de 7 días: ${lower(t)}`,
  'Pregunta': t=>`¿Sabes la verdad sobre ${lower(t)}?`,
};
const gen = {
  step(s, idx, topic, hook){
    if(s.key==='V' && hook) return hook;
    const t = s.templates[idx % s.templates.length] || s.templates[0];
    return t.replace(/\{idea\}/g, lower(topic)).replace(/\{nicho\}/g, S.prefs.niche).replace(/\{beneficio\}/g,'más alcance y ventas').replace(/\{avatar\}/g,'creador');
  },
  script(idea, hook){
    const topic = shorten(idea).replace(/^(cómo|como|qué|que)\s+/i,'');
    hook = hook || (DATA.ideas.find(x=>x.idea===idea)||{}).hook;
    const steps = DATA.framework.steps.map((s,i)=>({ key:s.key, name:s.name, purpose:s.purpose, ti:0, text: gen.step(s,0,topic,hook) }));
    return { id:uid(), title:idea, steps, topic, hook, niche:S.prefs.niche, platform:S.prefs.platform, goal:S.prefs.goal, state:'borrador', createdAt:Date.now() };
  },
  multiply(idea){ const topic=shorten(idea); return DATA.angles.map(a=>({ angle:a, title:(AT[a]||((t)=>a+': '+t))(topic) })); },
  randomIdea(){ const b=DATA.ideas[Math.floor(Math.random()*DATA.ideas.length)]; return b? b.idea : DATA.randomizer[0]; },
};

/* ---------- actions ---------- */
function saveScript(sc){ set(s=>{ if(!s.scripts.find(x=>x.id===sc.id)) s.scripts.unshift(sc); s.rings.guion=Math.min(100,s.rings.guion+34); s.onboarding.guion=true; s.xp+=15; }); toast('Guion guardado ✅ +15 XP'); }
function saveIdea(text){ if(!text) return; set(s=>{ s.ideas.unshift({id:uid(), text, fav:false, at:Date.now()}); s.rings.idea=Math.min(100,s.rings.idea+34); s.onboarding.semilla=true; s.xp+=5; }); toast('Idea guardada 💡 +5 XP'); }
function toggleFav(id){ set(s=>{ const i=s.ideas.find(x=>x.id===id); if(i) i.fav=!i.fav; }); }
function scriptById(id){ return S.scripts.find(x=>x.id===id); }
function copyScript(id){ const sc=scriptById(id); if(sc){ navigator.clipboard&&navigator.clipboard.writeText(scriptToText(sc)); toast('Copiado ⧉'); } }
function delScript(id){ if(!confirm('¿Eliminar este guion?')) return; set(s=>s.scripts=s.scripts.filter(x=>x.id!==id)); toast('Guion eliminado'); }
function dupScript(id){ const sc=scriptById(id); if(!sc) return; set(s=>s.scripts.unshift(Object.assign({},sc,{id:uid(), title:sc.title+' (copia)', state:'borrador', createdAt:Date.now()}))); toast('Guion duplicado'); }
function cycleState(id){ set(s=>{ const sc=s.scripts.find(x=>x.id===id); if(!sc) return; let i=STATES.indexOf(sc.state||'borrador'); sc.state=STATES[(i+1)%STATES.length]; if(sc.state==='grabado'){ s.rings.idea=s.rings.idea; s.onboarding.teleprompter=true; s.xp+=20;} if(sc.state==='publicado'){ s.rings.publicado=Math.min(100,s.rings.publicado+34); s.xp+=30; } }); toast('Estado actualizado'); }
function addCapture(t){ t=(t||'').trim(); if(!t)return; set(s=>s.captures.unshift({id:uid(),text:t})); toast('Capturado 🎒'); }
function addCaptureImg(input){ const f=input.files&&input.files[0]; if(!f) return; const r=new FileReader(); r.onload=e=>{ set(s=>s.captures.unshift({id:uid(), img:e.target.result, text:f.name})); toast('Imagen añadida 🖼'); }; r.readAsDataURL(f); }
function delCapture(id){ set(s=>s.captures=s.captures.filter(x=>x.id!==id)); }
function scriptToText(sc){ return sc.steps.map(s=>s.text).join('\n\n'); }
function assignDay(di){ if(!S.scripts.length){ toast('Primero crea un guion'); return; } const list=S.scripts.map((s,i)=>`${i+1}. ${s.title}`).join('\n'); const pick=prompt('¿Qué guion agendas?\n\n'+list+'\n\nEscribe el número:'); const n=parseInt(pick); if(!n||n<1||n>S.scripts.length) return; const sc=S.scripts[n-1]; set(s=>{ (s.calendar[di]=s.calendar[di]||[]).push(sc.id); s.onboarding.agenda=true; s.xp+=8; }); toast('Agendado 🗓 +8 XP'); }
function unassign(di,id){ set(s=>{ s.calendar[di]=(s.calendar[di]||[]).filter(x=>x!==id); }); }
function markPublished(di,id){ set(s=>{ const sc=s.scripts.find(x=>x.id===id); if(sc&&sc.state!=='publicado'){ sc.state='publicado'; s.rings.publicado=Math.min(100,s.rings.publicado+34); s.xp+=30; } }); toast('¡Publicado! 🚀 +30 XP'); }
function sugerirSemana(){ set(s=>{ DAYS.forEach((d,i)=>{ if(!(s.calendar[i]||[]).length && !s.calendar['sug_'+i]){ const p=DATA.pillars[i%DATA.pillars.length]; s.calendar['sug_'+i]=p.name+': '+gen.randomIdea(); } }); s.xp+=25; }); toast('Semana sugerida ✨ +25 XP'); }
function addVoice(){ const n=prompt('Nombre de la voz (ej: "Yo casual")'); if(!n) return; const tone=prompt('Describe tu tono en una frase (ej: cercano, directo, con humor)')||''; set(s=>{ s.voices.unshift({id:uid(), name:n, tone}); if(!s.activeVoice) s.activeVoice=s.voices[0].id; }); toast('Voz creada 🗣️'); }

function delVoice(id){ set(s=>{ s.voices=s.voices.filter(v=>v.id!==id); if(s.activeVoice===id) s.activeVoice=s.voices[0]?s.voices[0].id:null; }); }

const TP = {
  raf:null, y:0, playing:false,
  open(text){ if(!text){ toast('Nada que leer'); return; } $('#tpText').textContent=text; $('#tp').classList.add('on'); this.y=window.innerHeight*0.9; this.playing=true; $('#tpPlay').textContent='⏸ Pausa'; const size=$('#tpSize'); $('#tpText').style.fontSize=size.value+'px'; size.oninput=()=>$('#tpText').style.fontSize=size.value+'px'; cancelAnimationFrame(this.raf); this.loop(); set(s=>{ s.onboarding.teleprompter=true; }); },
  loop(){ const el=$('#tpText'); const speed=+$('#tpSpeed').value/60; if(this.playing){ this.y-=speed; el.style.transform='translateY('+this.y+'px)'; if(this.y < -el.offsetHeight){ this.y=window.innerHeight*0.9; } } this.raf=requestAnimationFrame(()=>this.loop()); },
  toggle(){ this.playing=!this.playing; $('#tpPlay').textContent=this.playing?'⏸ Pausa':'▶ Reanudar'; },

/* ---------- interactions ---------- */
function readPrefs(){ const n=$('#selNiche'),p=$('#selPlat'),g=$('#selGoal'),v=$('#selVoice'); if(n||p||g){ S.prefs.niche=n?n.value:S.prefs.niche; S.prefs.platform=p?p.value:S.prefs.platform; S.prefs.goal=g?g.value:S.prefs.goal; if(v&&v.value) S.activeVoice=v.value; save(); } }
function irCrear(v){ v=(v||'').trim(); if(!v){ toast('Escribe una idea primero'); return; } location.hash='#/crear'; setTimeout(()=>chatUserIdea(v),70); }
function sugerir(){ const i=$('#homeIdea'); if(i){ i.value=gen.randomIdea(); i.focus(); } }
function randomIntoCrear(){ irCrear(gen.randomIdea()); }
function stepCard(s){ return `<div class="step"><div class="k"><b>${s.key}</b><span class="nm">${s.name}</span><span class="pp">${esc(s.purpose)}</span><button class="rg" onclick="regenStep('${s.key}')">↻ otra</button></div><div class="tx" contenteditable="true" oninput="editStep('${s.key}',this.textContent)">${esc(s.text)}</div></div>`; }
function renderScript(sc){
  const out=$('#genOut'); if(!out) return;
  out.innerHTML=`<div class="card">
    <div class="head" style="margin-bottom:10px"><span class="eyebrow">Framework VIRAL</span><h3 style="width:100%">${esc(sc.title)}</h3>
      <div class="sp"></div><span class="eyebrow">~${durSec(sc)}s · ${words(sc)} palabras · ${sc.platform}</span></div>
    ${sc.steps.map(stepCard).join('')}
    <div class="row" style="margin:6px 0 0">
      <button class="btn accent" onclick="saveScript(window._last)">💾 Guardar guion</button>
      <button class="btn" onclick="TP.open(scriptToText(window._last))">🎬 Teleprompter</button>
      <button class="btn" onclick="multiplicar()">⚡ Multiplicar ×12</button>
      <button class="btn" onclick="copyLast()">⧉ Copiar</button>
    </div></div>`;
}
function generar(){
  readPrefs();
  const idea=($('#crearIdea')?.value||'').trim(); if(!idea){ toast('Escribe tu idea'); return; }
  const sc=gen.script(idea); window._last=sc;
  set(s=>{ s.onboarding.guion=true; s.rings.guion=Math.min(100,s.rings.guion+34); });
  const inp=$('#crearIdea'); if(inp) inp.value=idea;
  renderScript(sc);
}
function regenStep(key){ const sc=window._last; if(!sc) return; const st=sc.steps.find(x=>x.key===key); const def=DATA.framework.steps.find(x=>x.key===key); st.ti=(st.ti+1)%def.templates.length; st.text=gen.step(def, st.ti, sc.topic, key==='V'?sc.hook:null); if($('#chatThread')) renderChat(); else if($('#genOut')) renderScript(sc); }
function editStep(key,val){ const sc=window._last; if(!sc) return; const st=sc.steps.find(x=>x.key===key); if(st) st.text=val; }
function copyLast(){ if(window._last){ navigator.clipboard&&navigator.clipboard.writeText(scriptToText(window._last)); toast('Copiado ⧉'); } }
function multiplicar(){
  readPrefs();
  const idea=($('#crearIdea')?.value||$('#homeIdea')?.value||'tu idea').trim()||'tu idea';
  const list=gen.multiply(idea);
  const out=$('#genOut'); if(!out) return;
  out.innerHTML=`<div class="card"><div class="head" style="margin-bottom:12px"><span class="eyebrow">Multiplicador ×12</span><h3 style="width:100%">12 ángulos de: ${esc(shorten(idea))}</h3></div>
    <div class="grid g2">${list.map(a=>`<div class="idea-card"><span class="tag">${esc(a.angle)}</span><div style="font-weight:600">${esc(a.title)}</div>
      <button class="btn sm" style="margin-top:auto" onclick="irCrear('${jsq(a.title)}')">✦ Guion</button></div>`).join('')}</div></div>`;
  addXP(10); toast('12 ángulos ⚡ +10 XP');
}

/* ---------- chat (Crear conversacional) ---------- */
let chatThread=null;
function ensureChat(){ if(!chatThread) chatThread=[{who:'bot',kind:'greet'}]; }
function chatReset(){ chatThread=[{who:'bot',kind:'greet'}]; renderChat(); }
function scriptCardHTML(sc){
  return `<div class="head" style="margin-bottom:10px"><span class="eyebrow">Framework VIRAL</span><h3 style="width:100%">${esc(sc.title)}</h3><div class="sp"></div><span class="eyebrow">~${durSec(sc)}s · ${words(sc)} palabras · ${sc.platform}</span></div>
    ${sc.steps.map(stepCard).join('')}
    <div class="row" style="margin:6px 0 0">
      <button class="btn accent" onclick="saveScript(window._last)">💾 Guardar</button>
      <button class="btn" onclick="TP.open(scriptToText(window._last))">🎬 Teleprompter</button>
      <button class="btn" onclick="chatMultiplicar('${jsq(sc.title)}')">⚡ Multiplicar ×12</button>
    </div>`;
}
function chatBubble(m){
  if(m.kind==='greet') return `<div class="bub bot">¡Hola! ✨ ¿Qué quieres crear hoy? Escríbeme una idea, un tema o pégame un link.</div>`;
  if(m.kind==='user') return `<div class="bub user">${esc(m.text)}</div>`;
  if(m.kind==='bot-text') return `<div class="bub bot">${m.html||esc(m.text)}</div>`;
  if(m.kind==='actions') return `<div class="bub bot">¡Me gusta! ¿Qué hacemos con esto?<div class="acts"><button class="btn sm accent" onclick="chatConvertir('${jsq(m.idea)}')">✍️ Convertir en guion</button><button class="btn sm" onclick="chatGuardarIdea('${jsq(m.idea)}')">📓 Guardar como idea</button><button class="btn sm" onclick="location.hash='#/research'">🔎 Investigar</button></div></div>`;
  if(m.kind==='teaser') return `<div class="teaser"><b>Se me ocurre esto para arrancar 👇</b><br>Gancho: "${esc(m.gancho)}"<br><span style="color:var(--muted)">Estructura sugerida: Hook + 3 puntos numerados (5-7 seg c/u) + solución rápida + CTA.</span></div>`;
  if(m.kind==='script') return `<div class="bub bot" style="max-width:100%">${scriptCardHTML(m.sc)}</div>`;
  return '';
}
function renderChat(){ const el=$('#chatThread'); if(!el) return; el.innerHTML=chatThread.map(chatBubble).join(''); el.scrollTop=el.scrollHeight; }
function chatUserIdea(text){ ensureChat(); chatThread.push({who:'user',kind:'user',text}); chatThread.push({who:'bot',kind:'actions',idea:text}); renderChat(); }
function chatSend(){ readPrefs(); const inp=$('#chatInput'); const v=((inp&&inp.value)||'').trim(); if(!v){ toast('Escribe una idea'); return; } if(inp) inp.value=''; if(/^https?:\/\//i.test(v)){ ensureChat(); chatThread.push({who:'user',kind:'user',text:v}); chatThread.push({who:'bot',kind:'bot-text',text:'Los links → guion llegan en la fase 2 (con tu pipeline de transcripción). Por ahora escríbeme el tema. 🙌'}); renderChat(); return; } chatUserIdea(v); }
async function chatConvertir(idea){
  readPrefs();
  const b=DATA.ideas.find(x=>x.idea===idea); const gancho=(b&&b.hook)||('¿'+cap(shorten(idea))+'? Esto te va a servir.');
  chatThread.push({who:'bot',kind:'teaser',gancho});
  chatThread.push({who:'bot',kind:'bot-text',text:'Generando tu guion con IA (Claude)… ✍️'});
  renderChat();
  let sc = await generarConIA(idea, gancho);
  if(!sc){ sc = gen.script(idea, gancho); }  // fallback local si la IA falla
  window._last=sc;
  // reemplaza el "Generando…" por el guion
  chatThread.pop();
  chatThread.push({who:'bot',kind:'bot-text',text: sc.ia? '¡Listo! Guion generado con Claude ✨' : 'Te armé el guion con el framework VIRAL (modo local) ✍️'});
  chatThread.push({who:'bot',kind:'script',sc});
  set(s=>{ s.onboarding.guion=true; s.rings.guion=Math.min(100,s.rings.guion+34); s.xp+=15; });
  renderChat();
}
/* Llama al endpoint server de la app (Claude real). Devuelve un `sc` con la
   misma forma que gen.script, o null si falla (para caer al fallback local). */
async function generarConIA(idea, hook){
  try{
    const r = await fetch('/api/creacion-ideas/generar', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ idea, hook, niche:S.prefs.niche, platform:S.prefs.platform, goal:S.prefs.goal })
    });
    const j = await r.json();
    if(!j.ok || !Array.isArray(j.steps)){ if(j&&j.error) toast('IA: '+j.error); return null; }
    const steps = j.steps.map(s=>({ key:s.key, name:s.name, purpose:s.purpose, ti:0, text:s.text }));
    return { id:uid(), title:idea, steps, topic:shorten(idea), hook, niche:S.prefs.niche, platform:S.prefs.platform, goal:S.prefs.goal, state:'borrador', createdAt:Date.now(), ia:true };
  }catch(e){ return null; }
}
function chatGuardarIdea(idea){ saveIdea(idea); chatThread.push({who:'bot',kind:'bot-text',text:'Guardada en tus ideas 💡 La ves en la pestaña Ideas.'}); renderChat(); }
function chatMultiplicar(idea){ const list=gen.multiply(idea); const html='<b>12 ángulos de: '+esc(shorten(idea))+'</b><div class="grid g2" style="margin-top:10px">'+list.map(a=>`<div class="idea-card"><span class="tag">${esc(a.angle)}</span><div style="font-weight:600">${esc(a.title)}</div><button class="btn sm" style="margin-top:auto" onclick="chatUserIdea('${jsq(a.title)}')">✦ Guion</button></div>`).join('')+'</div>'; chatThread.push({who:'bot',kind:'bot-text',html}); addXP(10); renderChat(); toast('12 ángulos ⚡ +10 XP'); }
function dictar(){ const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ toast('Tu navegador no soporta dictado por voz'); return; } const r=new SR(); r.lang='es-PE'; r.interimResults=false; toast('🎤 Escuchando…'); r.onresult=e=>{ const t=e.results[0][0].transcript; const inp=$('#chatInput'); if(inp) inp.value=t; toast('Listo, revisa y envía ✍️'); }; r.onerror=()=>toast('No pude escuchar 🎤'); r.start(); }
function saveLibreta(k,v){ S.libreta[k]=v; save(); }
function addSerie(){ const n=prompt('Nombre de la serie (ej: "Errores de novato")'); if(!n) return; const f=prompt('Formato / cadencia (ej: "Cada lunes, 30s")')||'serie'; set(s=>s.series.unshift({id:uid(), name:n, format:f})); toast('Serie creada 📚'); }
function delSerie(id){ set(s=>s.series=s.series.filter(x=>x.id!==id)); }

/* ---------- router ---------- */
const NORAIL=['crear','libreta','ideas','guiones','series','research','calendario','teleprompter','mivoz','capturas','cuenta'];
function currentRoute(){ return (location.hash.replace('#/','')||'inicio'); }
function render(){
  document.documentElement.setAttribute('data-theme', S.theme);
  const r=currentRoute(); const fn=screens[r]||screens.inicio;
  const withRail = r==='inicio';
  const cls = r==='inicio' ? 'shell' : (NORAIL.includes(r)?'shell no-rail':'shell full');
  const showSide = r==='inicio' || NORAIL.includes(r);
  $('#root').innerHTML = topbar(r) + `<div class="${cls}">${showSide?sidebar():''}${fn()}${withRail?rail():''}</div>` +
    `<div class="foot">${BRAND.name} · guiones con IA (Claude) conectada a tu sistema · tus datos viven en este navegador.</div>`;
  if(r==='crear') renderChat();
}
window.addEventListener('hashchange', render);
(function tickStreak(){ const last=localStorage.getItem('creacion-ideas.lastDay'); const today=new Date().toDateString(); if(last && last!==today){ S.streak+=1; S.streakRecord=Math.max(S.streakRecord,S.streak); save(); } localStorage.setItem('creacion-ideas.lastDay',today); })();
render();
</script>
