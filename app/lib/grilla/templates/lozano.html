<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #DCC32C;  /* Amarillo dorado oficial Lozano */
    --primary-soft: #F4E180;
    --black:     #0C0C12;  /* Negro con tendencia azulada */
    --canvas:    #FAF8F2;  /* Crema cálido */
    --white:     #FFFFFF;
    --card-white: #FFFFFF;
    --card-yellow: #FBF4D0;
    --card-cream: #F5EFE0;
    --acc-yellow: #DCC32C;
    --acc-black:  #0C0C12;
    --display:  'Bebas Neue', Impact, sans-serif;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--black);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: bloques geométricos amarillos (mueble silhouette) */
  .deco { position: absolute; pointer-events: none; }
  .deco.tr { top: -60px; right: -80px; width: 320px; height: 320px;
    background: var(--primary); opacity: .12; transform: rotate(35deg); border-radius: 30px; }
  .deco.bl { bottom: -100px; left: -100px; width: 260px; height: 380px;
    background: var(--black); opacity: .06; transform: rotate(-20deg); border-radius: 20px; }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 180px; height: 180px; flex-shrink: 0; object-fit: contain;
    margin: -20px -10px -20px -20px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-size: 24px; font-weight: 500; letter-spacing: 4px;
    color: var(--black); line-height: 1; margin-bottom: 8px; text-transform: uppercase; }
  .brand-name .big { font-family: var(--display); font-size: 86px; font-weight: 400;
    letter-spacing: 2px; color: var(--black); line-height: .9; }
  .date-pill { background: var(--black); color: var(--primary); font-weight: 700;
    font-size: 22px; letter-spacing: 1.5px; padding: 16px 26px; border-radius: 0;
    white-space: nowrap; align-self: center; text-transform: uppercase;
    font-family: var(--sans); }

  .hero { text-align: center; margin: 60px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-family: var(--display); font-weight: 400;
    font-size: 178px; color: var(--black); line-height: .88; letter-spacing: 2px;
    text-transform: uppercase; }
  .hero h1 .accent { color: var(--primary); }
  .hero .sub { font-size: 24px; font-weight: 500; color: var(--black);
    margin-top: 18px; letter-spacing: 1px; text-transform: uppercase; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-top: 22px; }
  .divider .line { width: 220px; height: 4px; background: var(--primary); }
  .divider .dot  { width: 12px; height: 12px; background: var(--primary); }

  .cards { display: flex; flex-direction: column; gap: 22px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-white)); border-radius: 6px;
    padding: 28px 36px; display: flex; align-items: center; gap: 28px;
    min-height: 140px; position: relative;
    border-left: 8px solid var(--acc, var(--primary)); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 120px; }
  .card .date .day { font-family: var(--display); font-size: 90px; font-weight: 400;
    color: var(--black); line-height: .85; letter-spacing: 1px; }
  .card .date .month { font-size: 22px; font-weight: 700;
    color: var(--acc, var(--primary)); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .card .bar { display: none; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 38px; font-weight: 700; color: var(--black);
    line-height: 1.1; letter-spacing: -.3px; }
  .card .body .meta { font-size: 18px; font-weight: 500; color: var(--black);
    letter-spacing: 1px; opacity: .75; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 80px; height: 80px; color: var(--black); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(12,12,18,.15);
    border-left: 8px dashed rgba(12,12,18,.15);
    min-height: 90px; padding: 20px 36px; }
  .card.empty .body .title { font-size: 26px; font-weight: 500; opacity: .5; }
  .card.empty .body .meta { font-size: 16px; opacity: .4; }
  .card.empty .date .day { font-size: 58px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .25; width: 50px; height: 50px; }

  .card.is-white  { --card-bg: var(--card-white); --acc: var(--acc-yellow); }
  .card.is-yellow { --card-bg: var(--card-yellow); --acc: var(--acc-yellow); }
  .card.is-cream  { --card-bg: var(--card-cream);  --acc: var(--acc-black); }

  .footer { margin-top: auto; padding-top: 24px; text-align: center;
    position: relative; z-index: 1; border-top: 2px solid var(--primary); }
  .footer .agency { display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--display); font-size: 28px; font-weight: 400; color: var(--black);
    letter-spacing: 5px; text-transform: uppercase; margin-top: 18px; }
  .footer .url { font-size: 16px; font-weight: 400; color: var(--black);
    margin-top: 6px; letter-spacing: 1px; opacity: .7; }
</style>
</head>
<body>
<div class="poster">
  <div class="deco tr"></div>
  <div class="deco bl"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Muebles Lozano" />
    <div class="brand-name">
      <div class="small">Muebles a medida · Lima</div>
      <div class="big">MUEBLES LOZANO</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <section class="hero">
    <h1>¿QUÉ SE <span class="accent">VIENE?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
