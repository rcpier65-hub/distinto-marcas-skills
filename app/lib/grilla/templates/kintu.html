<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:    #45B787;  /* Verde Kintu oficial */
    --deep:       #1A3E42;
    --mint:       #BBE0CD;
    --mint-soft:  #DDEDE3;
    --canvas:     #F8FAF5;
    --canvas-warm: #F0EDE3;
    --white:      #FFFFFF;
    --card-white: #FFFFFF;
    --card-mint:  #DDEDE3;
    --card-deep:  #1A3E42;
    --card-cream: #F5F0E5;
    --sans:     'Montserrat', system-ui, -apple-system, sans-serif;
    --serif:    'Cormorant Garamond', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--deep);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Pattern botánico de fondo sutil */
  .botanical-pattern { position: absolute; inset: 0; pointer-events: none;
    background-image:
      radial-gradient(circle at 15% 25%, var(--mint) 0%, transparent 8%),
      radial-gradient(circle at 85% 20%, var(--mint) 0%, transparent 10%),
      radial-gradient(circle at 30% 75%, var(--mint) 0%, transparent 9%),
      radial-gradient(circle at 75% 85%, var(--mint) 0%, transparent 7%);
    opacity: .4; }

  /* Decoraciones: hojas + gotas orgánicas */
  .leaf { position: absolute; pointer-events: none; }
  .leaf.tr { top: -80px; right: -80px; width: 360px; height: 360px;
    background: var(--mint); opacity: .65;
    border-radius: 100% 50% 100% 50%; transform: rotate(35deg); }
  .leaf.tr-vein { position: absolute; top: 60px; right: 100px; width: 180px; height: 4px;
    background: var(--primary); opacity: .15; transform: rotate(-55deg); border-radius: 4px; }
  .leaf.tr2 { top: 140px; right: 20px; width: 120px; height: 120px;
    background: var(--primary); opacity: .18;
    border-radius: 100% 50% 100% 50%; transform: rotate(-30deg); }
  .leaf.bl { bottom: -100px; left: -80px; width: 380px; height: 300px;
    background: var(--mint); opacity: .5;
    border-radius: 50% 100% 50% 100%; transform: rotate(-12deg); }
  .leaf.bl-vein { position: absolute; bottom: 50px; left: 80px; width: 220px; height: 3px;
    background: var(--primary); opacity: .15; transform: rotate(20deg); border-radius: 3px; }
  .leaf.ml { top: 580px; left: -30px; width: 100px; height: 80px;
    background: var(--primary); opacity: .15;
    border-radius: 50% 100% 50% 100%; transform: rotate(45deg); }

  /* Gotitas */
  .drop { position: absolute; background: var(--primary); border-radius: 50% 50% 50% 0;
    pointer-events: none; transform: rotate(-45deg); opacity: .5; }
  .drop.d1 { top: 280px; right: 110px; width: 16px; height: 22px; }
  .drop.d2 { top: 340px; right: 80px; width: 10px; height: 14px; opacity: .3; }

  /* HEADER */
  .header { display: flex; align-items: center; gap: 26px; margin-bottom: 16px;
    position: relative; z-index: 2; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    background: var(--white); border-radius: 50%; padding: 16px;
    box-shadow: 0 8px 24px rgba(26,62,66,.12); }
  .brand-name { flex: 1; }
  .brand-name .small { font-family: var(--sans); font-size: 13px; font-weight: 600;
    letter-spacing: 8px; color: var(--primary); line-height: 1; margin-bottom: 8px;
    text-transform: uppercase; }
  .brand-name .big { font-family: var(--sans); font-size: 88px; font-weight: 800;
    letter-spacing: -3px; color: var(--deep); line-height: .9; }
  .brand-name .tag { font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: 22px; color: var(--primary); margin-top: 6px; }
  .date-pill { background: var(--deep); color: var(--mint); font-weight: 600;
    font-size: 18px; letter-spacing: 2px; padding: 14px 26px; border-radius: 999px;
    white-space: nowrap; align-self: flex-start; font-family: var(--sans);
    text-transform: uppercase; }
  .date-pill::before { content: '🌿 '; }

  /* Sello 100% puro */
  .badge-pure { position: absolute; top: 300px; left: 60px; z-index: 2;
    width: 140px; height: 140px; background: var(--primary); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: var(--white); transform: rotate(-10deg);
    box-shadow: 0 12px 24px rgba(69,183,135,.4);
    border: 3px solid var(--white); }
  .badge-pure .num { font-family: var(--sans); font-size: 44px; font-weight: 800;
    line-height: .9; letter-spacing: -1px; }
  .badge-pure .label { font-family: var(--sans); font-size: 11px; font-weight: 700;
    letter-spacing: 3px; margin-top: 4px; text-transform: uppercase; }
  .badge-pure .leaf-icon { font-size: 20px; margin-bottom: 2px; }

  /* HERO */
  .hero { text-align: center; margin: 80px 0 50px; position: relative; z-index: 2; }
  .hero h1 { font-family: var(--sans); font-weight: 800; font-size: 156px;
    color: var(--deep); line-height: .88; letter-spacing: -5px; }
  .hero h1 .accent { color: var(--primary); }
  .hero h1 .serif { font-family: var(--serif); font-style: italic; font-weight: 500;
    color: var(--primary); }
  .hero .sub { font-family: var(--sans); font-size: 16px; font-weight: 500;
    color: var(--deep); margin-top: 22px; letter-spacing: 6px;
    text-transform: uppercase; opacity: .7; }
  .hero .ritual { font-family: var(--serif); font-style: italic; font-size: 26px;
    color: var(--primary); margin-top: 8px; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-top: 22px; }
  .divider .line { width: 100px; height: 1px; background: var(--primary); }
  .divider .leaf-ico { color: var(--primary); font-size: 22px; }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 16px; margin-top: 10px;
    position: relative; z-index: 2; }
  .card { background: var(--card-bg, var(--card-white)); border-radius: 24px;
    padding: 24px 30px; display: flex; align-items: center; gap: 26px;
    min-height: 130px; position: relative;
    border: 1.5px solid var(--mint);
    box-shadow: 0 4px 12px rgba(26,62,66,.05); }
  .card::after { content: '🌿'; position: absolute; top: 14px; right: 18px;
    font-size: 14px; opacity: .4; }
  .card .date { flex-shrink: 0; text-align: left; min-width: 110px;
    border-right: 1.5px dotted var(--mint); padding-right: 22px; }
  .card .date .day { font-family: var(--sans); font-size: 80px; font-weight: 800;
    color: var(--deep); line-height: .85; letter-spacing: -2px; }
  .card .date .month { font-family: var(--sans); font-size: 12px; font-weight: 700;
    color: var(--acc, var(--primary)); letter-spacing: 4px;
    text-transform: uppercase; margin-top: 4px; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-family: var(--serif); font-style: italic; font-weight: 600;
    font-size: 30px; color: var(--deep); line-height: 1.15; letter-spacing: -.3px; }
  .card .body .meta { font-family: var(--sans); font-size: 12px; font-weight: 600;
    color: var(--deep); letter-spacing: 3px; opacity: .6; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 66px; height: 66px; color: var(--primary);
    background: var(--mint-soft); border-radius: 50%; padding: 16px;
    display: flex; align-items: center; justify-content: center; }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(26,62,66,.15);
    border-radius: 24px; min-height: 72px; padding: 14px 30px; box-shadow: none; }
  .card.empty::after { display: none; }
  .card.empty .body .title { font-family: var(--sans); font-style: normal;
    font-size: 16px; font-weight: 500; opacity: .35; }
  .card.empty .body .meta { display: none; }
  .card.empty .date { border: none; }
  .card.empty .date .day { font-size: 46px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .2; background: transparent; padding: 0; }

  .card.is-white { --card-bg: var(--card-white); --acc: var(--primary); }
  .card.is-mint  { --card-bg: var(--card-mint);  --acc: var(--deep); }
  .card.is-cream { --card-bg: var(--card-cream); --acc: var(--primary); }
  .card.is-deep  { --card-bg: var(--card-deep);  --acc: var(--mint); color: var(--white);
    border-color: var(--deep); }
  .card.is-deep .date .day, .card.is-deep .body .title { color: var(--white); }
  .card.is-deep .body .meta { color: var(--white); opacity: .65; }
  .card.is-deep .date { border-right-color: rgba(255,255,255,.2); }
  .card.is-deep .icon { background: rgba(255,255,255,.12); }

  /* FOOTER */
  .footer { margin-top: auto; padding-top: 26px; position: relative; z-index: 2;
    border-top: 1.5px solid var(--mint); }
  .footer .row { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
  .footer .left { display: flex; flex-direction: column; gap: 4px; }
  .footer .tagline { font-family: var(--serif); font-style: italic; font-size: 22px;
    color: var(--primary); }
  .footer .sub { font-family: var(--sans); font-size: 11px; font-weight: 500;
    color: var(--deep); letter-spacing: 4px; text-transform: uppercase; opacity: .55; }
  .footer .agency { display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--sans); font-size: 18px; font-weight: 700; color: var(--deep);
    letter-spacing: 5px; text-transform: uppercase; }
  .footer .agency .leaf-ico { color: var(--primary); }
</style>
</head>
<body>
<div class="poster">
  <div class="botanical-pattern"></div>
  <div class="leaf tr"></div>
  <div class="leaf tr-vein"></div>
  <div class="leaf tr2"></div>
  <div class="leaf bl"></div>
  <div class="leaf bl-vein"></div>
  <div class="leaf ml"></div>
  <div class="drop d1"></div>
  <div class="drop d2"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Kintu" />
    <div class="brand-name">
      <div class="small">Essential Oils · Perú</div>
      <div class="big">kintu</div>
      <div class="tag">Aromaterapia consciente · Rituales para tu bienestar</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <div class="badge-pure">
    <div class="leaf-icon">🌿</div>
    <div class="num">100%</div>
    <div class="label">Puro</div>
  </div>

  <section class="hero">
    <h1>¿qué se<br><span class="serif">viene?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="ritual">— rituales de la semana —</div>
    <div class="divider"><span class="line"></span><span class="leaf-ico">🌿</span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="row">
      <div class="left">
        <div class="tagline">Cuidarte de forma simple y consciente</div>
        <div class="sub">San Miguel · Lima Perú</div>
      </div>
      <div class="agency"><span class="leaf-ico">🌿</span>DISTINTO · AGENCIA</div>
    </div>
  </footer>
</div>
</body>
</html>
