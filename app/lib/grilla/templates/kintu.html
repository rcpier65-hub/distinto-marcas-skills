<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #45B787;  /* Verde Kintu oficial */
    --deep:      #1A3E42;  /* Verde profundo */
    --mint:      #BBE0CD;  /* Verde menta claro */
    --canvas:    #F4F8F4;  /* Off-white verdoso */
    --white:     #FFFFFF;
    --card-white: #FFFFFF;
    --card-mint:  #DCEFE0;
    --card-deep:  #1A3E42;
    --sans:     'Montserrat', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--deep);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: hojas / patrón orgánico */
  .leaf { position: absolute; pointer-events: none; }
  .leaf.tr { top: -60px; right: -80px; width: 320px; height: 320px;
    background: var(--mint); opacity: .5;
    border-radius: 100% 50% 100% 50%; transform: rotate(40deg); }
  .leaf.tr2 { top: 100px; right: 40px; width: 120px; height: 120px;
    background: var(--primary); opacity: .15;
    border-radius: 100% 50% 100% 50%; transform: rotate(-30deg); }
  .leaf.bl { bottom: -100px; left: -80px; width: 360px; height: 280px;
    background: var(--mint); opacity: .4;
    border-radius: 50% 100% 50% 100%; transform: rotate(-15deg); }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    margin: -15px -10px -15px -15px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-size: 22px; font-weight: 400; letter-spacing: 6px;
    color: var(--deep); line-height: 1; margin-bottom: 8px; text-transform: uppercase; opacity: .7; }
  .brand-name .big { font-size: 78px; font-weight: 800; letter-spacing: -2px;
    color: var(--deep); line-height: .92; }
  .date-pill { background: var(--primary); color: var(--white); font-weight: 600;
    font-size: 22px; letter-spacing: 1px; padding: 16px 28px; border-radius: 999px;
    white-space: nowrap; align-self: center; }

  .hero { text-align: center; margin: 60px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-size: 158px; font-weight: 800; color: var(--deep);
    line-height: .9; letter-spacing: -5px; }
  .hero h1 .accent { color: var(--primary); }
  .hero .sub { font-size: 22px; font-weight: 500; color: var(--deep);
    margin-top: 24px; letter-spacing: 3px; text-transform: uppercase; opacity: .8; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-top: 22px; }
  .divider .line { width: 220px; height: 2px; background: var(--primary); border-radius: 2px; }
  .divider .dot  { width: 14px; height: 14px; background: var(--primary); border-radius: 50%; }

  .cards { display: flex; flex-direction: column; gap: 20px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-white)); border-radius: 28px;
    padding: 26px 36px; display: flex; align-items: center; gap: 28px;
    min-height: 140px; position: relative;
    border: 2px solid var(--mint); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 120px; }
  .card .date .day { font-size: 82px; font-weight: 800; color: var(--deep);
    line-height: .85; letter-spacing: -2px; }
  .card .date .month { font-size: 20px; font-weight: 600;
    color: var(--acc, var(--primary)); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .card .bar { width: 3px; height: 100px; background: var(--acc, var(--primary));
    border-radius: 2px; flex-shrink: 0; opacity: .8; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 32px; font-weight: 700; color: var(--deep);
    line-height: 1.1; letter-spacing: -.5px; }
  .card .body .meta { font-size: 18px; font-weight: 500; color: var(--deep);
    opacity: .7; letter-spacing: 1px; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 80px; height: 80px; color: var(--primary); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(26,62,66,.18);
    min-height: 80px; padding: 18px 36px; }
  .card.empty .body .title { font-size: 22px; opacity: .4; }
  .card.empty .body .meta { font-size: 14px; opacity: .3; }
  .card.empty .date .day { font-size: 52px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .25; width: 44px; height: 44px; }
  .card.empty .bar { opacity: 0; }

  .card.is-white { --card-bg: var(--card-white); --acc: var(--primary); }
  .card.is-mint  { --card-bg: var(--card-mint);  --acc: var(--deep); }
  .card.is-deep  { --card-bg: var(--card-deep);  --acc: var(--mint); color: var(--white); border-color: var(--deep); }
  .card.is-deep .body .title, .card.is-deep .date .day { color: var(--white); }

  .footer { margin-top: auto; padding-top: 24px; text-align: center;
    position: relative; z-index: 1; border-top: 2px solid var(--mint); }
  .footer .agency { display: inline-flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 700; color: var(--deep);
    letter-spacing: 4px; text-transform: uppercase; margin-top: 18px; }
  .footer .url { font-size: 14px; font-weight: 400; color: var(--deep);
    margin-top: 4px; letter-spacing: 2px; opacity: .6; }
  .footer .tagline { font-size: 16px; font-weight: 400; color: var(--primary);
    letter-spacing: 4px; text-transform: uppercase; margin-bottom: 6px; }
</style>
</head>
<body>
<div class="poster">
  <div class="leaf tr"></div>
  <div class="leaf tr2"></div>
  <div class="leaf bl"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Kintu" />
    <div class="brand-name">
      <div class="small">Essential Oils</div>
      <div class="big">kintu</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <section class="hero">
    <h1>¿qué se<br><span class="accent">viene?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="tagline">Rituales conscientes</div>
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
