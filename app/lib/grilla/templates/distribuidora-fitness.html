<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #F54922;  /* Naranja DF oficial */
    --primary-bright: #FF6B45;
    --black:     #1A1A1A;  /* Negro suave (no #000) */
    --gray:      #333333;
    --canvas:    #0F0F12;  /* Casi negro — feel gym oscuro */
    --white:     #FFFFFF;
    --card-dark:  #1F1F22;
    --card-darker: #161618;
    --acc-orange: #F54922;
    --display:  'Bebas Neue', Impact, sans-serif;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--white);
    -webkit-font-smoothing: antialiased; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: líneas diagonales dinámicas + gradient naranja */
  .deco { position: absolute; pointer-events: none; }
  .deco.glow { top: -200px; right: -150px; width: 600px; height: 600px;
    background: radial-gradient(circle, var(--primary) 0%, transparent 70%);
    opacity: .25; }
  .deco.line { position: absolute; top: 30%; right: 0; width: 400px; height: 4px;
    background: var(--primary); transform: rotate(-12deg); opacity: .4; }
  .deco.line2 { position: absolute; bottom: 25%; left: -100px; width: 500px; height: 3px;
    background: var(--primary); transform: rotate(8deg); opacity: .3; }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    margin: -15px -10px -15px -15px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-size: 22px; font-weight: 200; letter-spacing: 6px;
    color: var(--white); line-height: 1; margin-bottom: 8px; text-transform: uppercase; opacity: .7; }
  .brand-name .big { font-family: var(--display); font-size: 78px; font-weight: 400;
    letter-spacing: 1px; color: var(--white); line-height: .9; }
  .brand-name .big .accent { color: var(--primary); }
  .date-pill { background: var(--primary); color: var(--white); font-weight: 700;
    font-size: 22px; letter-spacing: 1.5px; padding: 16px 26px;
    transform: skew(-8deg);
    white-space: nowrap; align-self: center; text-transform: uppercase;
    font-family: var(--sans); }
  .date-pill span { display: inline-block; transform: skew(8deg); }

  .hero { text-align: center; margin: 60px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-family: var(--display); font-weight: 400;
    font-size: 188px; color: var(--white); line-height: .85; letter-spacing: 2px;
    text-transform: uppercase; }
  .hero h1 .accent { color: var(--primary); }
  .hero h1 .strikethrough { position: relative; display: inline-block; }
  .hero h1 .strikethrough::after { content: ''; position: absolute; top: 50%;
    left: -10px; right: -10px; height: 8px; background: var(--primary); transform: rotate(-3deg); }
  .hero .sub { font-size: 24px; font-weight: 800; color: var(--primary);
    margin-top: 22px; letter-spacing: 2px; text-transform: uppercase; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 18px; }
  .divider .line { width: 200px; height: 3px; background: var(--white); opacity: .3; }
  .divider .dot  { width: 14px; height: 14px; background: var(--primary); transform: rotate(45deg); }

  .cards { display: flex; flex-direction: column; gap: 18px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-dark)); border-radius: 4px;
    padding: 26px 34px; display: flex; align-items: center; gap: 24px;
    min-height: 130px; position: relative;
    border-left: 6px solid var(--acc, var(--primary)); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 110px; }
  .card .date .day { font-family: var(--display); font-size: 88px; font-weight: 400;
    color: var(--white); line-height: .85; letter-spacing: 1px; }
  .card .date .month { font-size: 20px; font-weight: 700;
    color: var(--primary); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .card .bar { display: none; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 34px; font-weight: 800; color: var(--white);
    line-height: 1.05; letter-spacing: -.3px; text-transform: uppercase; }
  .card .body .meta { font-size: 16px; font-weight: 500; color: var(--white);
    letter-spacing: 1.5px; opacity: .7; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 70px; height: 70px; color: var(--primary); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(255,255,255,.12);
    border-left: 6px dashed rgba(245,73,34,.3);
    min-height: 80px; padding: 18px 34px; }
  .card.empty .body .title { font-size: 22px; opacity: .4; text-transform: none; }
  .card.empty .body .meta { font-size: 14px; opacity: .3; }
  .card.empty .date .day { font-size: 52px; opacity: .25; }
  .card.empty .date .month { opacity: .25; }
  .card.empty .icon { opacity: .2; width: 44px; height: 44px; }

  .card.is-dark   { --card-bg: var(--card-dark);   --acc: var(--primary); }
  .card.is-darker { --card-bg: var(--card-darker); --acc: var(--white); }
  .card.is-orange { --card-bg: var(--primary);     --acc: var(--white); color: var(--white); }
  .card.is-orange .body .title, .card.is-orange .date .day { color: var(--white); }
  .card.is-orange .date .month { color: var(--canvas); }

  .footer { margin-top: auto; padding-top: 24px; text-align: center;
    position: relative; z-index: 1; border-top: 2px solid var(--primary); }
  .footer .agency { display: inline-flex; align-items: center; gap: 14px;
    font-family: var(--display); font-size: 28px; font-weight: 400; color: var(--white);
    letter-spacing: 5px; text-transform: uppercase; margin-top: 18px; }
  .footer .url { font-size: 15px; font-weight: 400; color: var(--white);
    margin-top: 6px; letter-spacing: 1px; opacity: .5; }
</style>
</head>
<body>
<div class="poster">
  <div class="deco glow"></div>
  <div class="deco line"></div>
  <div class="deco line2"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Distribuidora Fitness" />
    <div class="brand-name">
      <div class="small">Suplementación premium · Perú</div>
      <div class="big">DISTRIBUIDORA <span class="accent">FITNESS</span></div>
    </div>
    <div class="date-pill"><span>{{DATE_PILL}}</span></div>
  </header>

  <section class="hero">
    <h1>¿QUÉ SE <span class="accent">VIENE?</span></h1>
    <div class="sub">{{DATE_SUB}} · #ProgresoNoStop</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
