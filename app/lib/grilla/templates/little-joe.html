<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #1E3A8A;  /* Azul royal italiano (asumido) */
    --primary-soft: #3B5CC0;
    --sky:       #C9D9F5;
    --accent:    #E63946;  /* Rojo Garra (Universitario opcional) */
    --canvas:    #F7F9FF;  /* Blanco azulado */
    --white:     #FFFFFF;
    --card-white: #FFFFFF;
    --card-soft: #ECF1FB;
    --card-sky:  #DAE5F7;
    --display:  'Quicksand', system-ui, sans-serif;
    --script:   'Caveat', cursive;
    --sans:     'Quicksand', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--primary);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: nubes / círculos suaves (mood Joe) */
  .cloud { position: absolute; background: var(--sky); opacity: .35; border-radius: 50%; }
  .cloud.tr1 { top: -100px; right: -50px; width: 280px; height: 280px; }
  .cloud.tr2 { top: 60px; right: 180px; width: 140px; height: 140px; opacity: .5; }
  .cloud.bl1 { bottom: -80px; left: -100px; width: 320px; height: 260px; }
  .cloud.bl2 { bottom: 120px; left: 200px; width: 100px; height: 100px; opacity: .6; }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 180px; height: 180px; flex-shrink: 0; object-fit: contain;
    margin: -20px -10px -20px -20px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-family: var(--script); font-size: 32px; font-weight: 500;
    color: var(--primary); line-height: 1; margin-bottom: 4px; }
  .brand-name .big { font-size: 64px; font-weight: 700; letter-spacing: -1px;
    color: var(--primary); line-height: .95; }
  .date-pill { background: var(--primary); color: var(--white); font-weight: 600;
    font-size: 22px; letter-spacing: 1px; padding: 16px 28px; border-radius: 999px;
    white-space: nowrap; align-self: center; }

  .hero { text-align: center; margin: 50px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-size: 138px; font-weight: 700; color: var(--primary);
    line-height: .92; letter-spacing: -3px; }
  .hero h1 .script { font-family: var(--script); font-weight: 700;
    color: var(--accent); font-size: 160px; letter-spacing: 0; }
  .hero .sub { font-size: 26px; font-weight: 500; color: var(--primary);
    margin-top: 18px; }
  .hero .sub .heart { color: var(--accent); }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 12px; margin-top: 22px; }
  .divider .line { width: 200px; height: 2px; background: var(--primary); opacity: .3; border-radius: 2px; }
  .divider .dot  { width: 14px; height: 14px; background: var(--accent); border-radius: 50%; }

  .cards { display: flex; flex-direction: column; gap: 22px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-white)); border-radius: 32px;
    padding: 28px 36px; display: flex; align-items: center; gap: 28px;
    min-height: 140px; position: relative;
    box-shadow: 0 2px 0 var(--sky); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 120px; }
  .card .date .day { font-size: 78px; font-weight: 700; color: var(--primary);
    line-height: .9; letter-spacing: -2px; }
  .card .date .month { font-size: 22px; font-weight: 600;
    color: var(--acc, var(--primary)); letter-spacing: 1px; text-transform: capitalize; margin-top: 4px; }
  .card .bar { width: 3px; height: 100px; background: var(--acc, var(--primary));
    border-radius: 2px; opacity: .7; flex-shrink: 0; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 32px; font-weight: 700; color: var(--primary);
    line-height: 1.1; letter-spacing: -.5px; }
  .card .body .meta { font-size: 18px; font-weight: 500; color: var(--primary);
    opacity: .7; }
  .card .icon { flex-shrink: 0; width: 80px; height: 80px; color: var(--primary); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(30,58,138,.18);
    min-height: 80px; padding: 18px 36px; box-shadow: none; }
  .card.empty .body .title { font-size: 22px; opacity: .4; }
  .card.empty .body .meta { font-size: 14px; opacity: .3; }
  .card.empty .date .day { font-size: 52px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .25; width: 44px; height: 44px; }

  .card.is-white { --card-bg: var(--card-white); --acc: var(--primary); }
  .card.is-soft  { --card-bg: var(--card-soft);  --acc: var(--accent); }
  .card.is-sky   { --card-bg: var(--card-sky);   --acc: var(--primary); }

  .footer { margin-top: auto; padding-top: 22px; text-align: center;
    position: relative; z-index: 1; }
  .footer .agency { display: inline-flex; align-items: center; gap: 12px;
    font-size: 22px; font-weight: 700; color: var(--primary);
    letter-spacing: 3px; text-transform: uppercase; }
  .footer .url { font-size: 16px; font-weight: 500; color: var(--primary);
    margin-top: 6px; opacity: .6; }
  .footer .tagline { font-family: var(--script); font-size: 28px;
    color: var(--accent); margin-bottom: 14px; }
</style>
</head>
<body>
<div class="poster">
  <div class="cloud tr1"></div>
  <div class="cloud tr2"></div>
  <div class="cloud bl1"></div>
  <div class="cloud bl2"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Little Joe" />
    <div class="brand-name">
      <div class="small">¡Hola! Soy</div>
      <div class="big">Little Joe</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <section class="hero">
    <h1>¿Qué se <span class="script">viene?</span></h1>
    <div class="sub">{{DATE_SUB}} <span class="heart">💕</span></div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="tagline">Pon una sonrisa en el aire ✨</div>
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
