<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Caveat:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:    #1E3A8A;  /* Azul royal italiano */
    --primary-deep: #142960;
    --sky:        #BFD4F5;
    --sky-soft:   #DCE8FA;
    --accent:     #E63946;  /* Rojo Universitario / amor */
    --gold:       #D4A93E;  /* Toque premium */
    --canvas:     #F8FBFF;  /* Blanco azulado */
    --canvas-deep: #EFF4FC;
    --white:      #FFFFFF;
    --card-white: #FFFFFF;
    --card-soft:  #F0F5FE;
    --card-sky:   #DCE8FA;
    --card-deep:  #1E3A8A;
    --display:  'Quicksand', system-ui, sans-serif;
    --script:   'Caveat', cursive;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--primary);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoraciones: nubes flotantes + ondas de aroma */
  .cloud { position: absolute; background: var(--sky); border-radius: 50%; pointer-events: none; }
  .cloud.tr1 { top: -100px; right: -50px; width: 320px; height: 320px; opacity: .4; }
  .cloud.tr2 { top: 70px; right: 220px; width: 130px; height: 130px; opacity: .6; }
  .cloud.tr3 { top: 230px; right: -30px; width: 80px; height: 80px; opacity: .5;
    background: var(--accent); }
  .cloud.ml { top: 50%; left: -80px; width: 200px; height: 200px; opacity: .35; }
  .cloud.bl1 { bottom: -100px; left: -100px; width: 340px; height: 280px; opacity: .35; }
  .cloud.bl2 { bottom: 140px; left: 220px; width: 90px; height: 90px; opacity: .55; }
  .cloud.br { bottom: 200px; right: -60px; width: 180px; height: 180px; opacity: .3; }

  /* Ondas aroma */
  .aroma { position: absolute; top: 320px; right: 80px; width: 120px; height: 160px;
    pointer-events: none; opacity: .4; }
  .aroma-line { position: absolute; left: 50%; width: 60px; height: 60px;
    border: 2px solid var(--primary); border-radius: 50% 50% 0 0; transform: translateX(-50%);
    border-bottom: none; }
  .aroma-line.a1 { top: 0; opacity: .8; }
  .aroma-line.a2 { top: 40px; width: 90px; opacity: .6; }
  .aroma-line.a3 { top: 80px; width: 120px; opacity: .4; }

  /* Estrellas */
  .star { position: absolute; color: var(--gold); font-size: 28px; pointer-events: none; opacity: .7; }
  .star.s1 { top: 100px; right: 380px; }
  .star.s2 { top: 480px; left: 110px; font-size: 22px; }
  .star.s3 { bottom: 320px; right: 90px; font-size: 32px; }

  /* HEADER */
  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 16px;
    position: relative; z-index: 2; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    background: var(--white); border-radius: 50%; padding: 14px;
    box-shadow: 0 8px 24px rgba(30,58,138,.18); }
  .brand-name { flex: 1; }
  .brand-name .small { font-family: var(--script); font-size: 32px; font-weight: 600;
    color: var(--accent); line-height: 1; margin-bottom: 0px; transform: rotate(-2deg); }
  .brand-name .big { font-family: var(--display); font-size: 78px; font-weight: 700;
    letter-spacing: -2px; color: var(--primary); line-height: .95; }
  .brand-name .tag { font-family: var(--sans); font-size: 14px; font-weight: 500;
    color: var(--primary); letter-spacing: 4px; text-transform: uppercase;
    margin-top: 6px; opacity: .7; }
  .date-pill { background: var(--primary); color: var(--white); font-weight: 700;
    font-size: 18px; letter-spacing: 1.5px; padding: 12px 24px; border-radius: 999px;
    white-space: nowrap; align-self: flex-start; font-family: var(--sans);
    box-shadow: 0 6px 20px rgba(30,58,138,.3); text-transform: uppercase; }
  .date-pill::before { content: '✦ '; color: var(--gold); }

  /* Sello italia + duración */
  .badge-italy { position: absolute; top: 300px; left: 60px; z-index: 2;
    width: 140px; height: 140px; background: var(--white); border-radius: 50%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; transform: rotate(-8deg);
    box-shadow: 0 12px 24px rgba(30,58,138,.15);
    border: 3px solid var(--primary); }
  .badge-italy .flag { font-size: 28px; line-height: 1; }
  .badge-italy .text { font-family: var(--display); font-weight: 700; font-size: 14px;
    color: var(--primary); letter-spacing: 1px; margin-top: 4px; }
  .badge-italy .text2 { font-family: var(--script); font-size: 22px;
    color: var(--accent); line-height: 1; margin-top: 2px; }

  /* HERO */
  .hero { text-align: center; margin: 70px 0 50px; position: relative; z-index: 2; }
  .hero h1 { font-family: var(--display); font-weight: 700; font-size: 142px;
    color: var(--primary); line-height: .9; letter-spacing: -4px; }
  .hero h1 .script { font-family: var(--script); font-weight: 700;
    color: var(--accent); font-size: 168px; letter-spacing: 0;
    display: inline-block; transform: rotate(-3deg); }
  .hero h1 .heart { color: var(--accent); font-size: 80px; vertical-align: middle; }
  .hero .sub { font-family: var(--sans); font-size: 22px; font-weight: 500;
    color: var(--primary); margin-top: 18px; letter-spacing: .5px; }
  .hero .sub .joe { font-family: var(--script); color: var(--accent); font-weight: 700;
    font-size: 30px; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 14px; margin-top: 22px; }
  .divider .line { width: 180px; height: 2px; background: var(--primary); opacity: .3; }
  .divider .star { color: var(--gold); font-size: 18px; opacity: 1; position: static; }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 18px; margin-top: 10px;
    position: relative; z-index: 2; }
  .card { background: var(--card-bg, var(--card-white)); border-radius: 28px;
    padding: 26px 32px; display: flex; align-items: center; gap: 26px;
    min-height: 134px; position: relative;
    box-shadow: 0 6px 20px rgba(30,58,138,.08), 0 2px 0 var(--sky); }
  .card::before { content: '✦'; position: absolute; top: 14px; right: 22px;
    color: var(--acc, var(--gold)); font-size: 18px; opacity: .6; }
  .card .date { flex-shrink: 0; text-align: center; min-width: 110px;
    border-right: 2px dotted rgba(30,58,138,.18); padding-right: 20px; }
  .card .date .day { font-family: var(--display); font-size: 80px; font-weight: 700;
    color: var(--primary); line-height: .85; letter-spacing: -2px; }
  .card .date .month { font-family: var(--script); font-size: 28px; font-weight: 600;
    color: var(--acc, var(--accent)); line-height: 1; margin-top: 2px; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 4px; }
  .card .body .title { font-family: var(--display); font-size: 30px; font-weight: 700;
    color: var(--primary); line-height: 1.1; letter-spacing: -.5px; }
  .card .body .meta { font-family: var(--sans); font-size: 14px; font-weight: 500;
    color: var(--primary); opacity: .65; letter-spacing: 2px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; }
  .card .body .meta::before { content: '🌸'; opacity: .7; }
  .card .icon { flex-shrink: 0; width: 70px; height: 70px;
    background: var(--acc, var(--sky)); border-radius: 50%; padding: 15px;
    color: var(--primary);
    display: flex; align-items: center; justify-content: center; }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(30,58,138,.18);
    border-radius: 28px; min-height: 76px; padding: 16px 32px; box-shadow: none; }
  .card.empty::before { display: none; }
  .card.empty .body .title { font-family: var(--sans); font-size: 16px; font-weight: 500;
    opacity: .4; }
  .card.empty .body .meta { display: none; }
  .card.empty .date { border: none; }
  .card.empty .date .day { font-size: 46px; opacity: .3; }
  .card.empty .date .month { opacity: .3; font-size: 18px; }
  .card.empty .icon { opacity: .2; background: transparent; padding: 0; }

  .card.is-white { --card-bg: var(--card-white); --acc: var(--sky); }
  .card.is-soft  { --card-bg: var(--card-soft);  --acc: var(--accent); }
  .card.is-sky   { --card-bg: var(--card-sky);   --acc: var(--gold); }
  .card.is-deep  { --card-bg: var(--card-deep);  --acc: var(--gold); color: var(--white); }
  .card.is-deep .date .day, .card.is-deep .body .title { color: var(--white); }
  .card.is-deep .body .meta { color: var(--white); opacity: .7; }
  .card.is-deep .date { border-right-color: rgba(255,255,255,.3); }
  .card.is-deep .icon { background: rgba(255,255,255,.15); color: var(--white); }

  /* FOOTER */
  .footer { margin-top: auto; padding-top: 22px; position: relative; z-index: 2; text-align: center; }
  .footer .tagline { font-family: var(--script); font-size: 36px; color: var(--accent);
    transform: rotate(-1deg); display: inline-block; margin-bottom: 8px; }
  .footer .row { display: flex; align-items: center; justify-content: space-between;
    border-top: 2px dotted rgba(30,58,138,.25); padding-top: 14px; }
  .footer .pais { font-family: var(--sans); font-size: 13px; font-weight: 700;
    color: var(--primary); letter-spacing: 3px; text-transform: uppercase;
    display: flex; align-items: center; gap: 8px; }
  .footer .agency { display: inline-flex; align-items: center; gap: 10px;
    font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--primary);
    letter-spacing: 4px; text-transform: uppercase; }
  .footer .agency .heart { color: var(--accent); }
</style>
</head>
<body>
<div class="poster">
  <div class="cloud tr1"></div>
  <div class="cloud tr2"></div>
  <div class="cloud tr3"></div>
  <div class="cloud ml"></div>
  <div class="cloud bl1"></div>
  <div class="cloud bl2"></div>
  <div class="cloud br"></div>

  <div class="aroma">
    <div class="aroma-line a1"></div>
    <div class="aroma-line a2"></div>
    <div class="aroma-line a3"></div>
  </div>

  <span class="star s1">✦</span>
  <span class="star s2">✦</span>
  <span class="star s3">✦</span>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Little Joe" />
    <div class="brand-name">
      <div class="small">¡Hola! Soy</div>
      <div class="big">Little Joe</div>
      <div class="tag">Made in Italia · 80+ países</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <div class="badge-italy">
    <div class="flag">🇮🇹</div>
    <div class="text">PREMIUM</div>
    <div class="text2">45 días</div>
  </div>

  <section class="hero">
    <h1>¿Qué se <br><span class="script">viene?</span> <span class="heart">💕</span></h1>
    <div class="sub">{{DATE_SUB}} <span class="joe">— ¡con Joe!</span></div>
    <div class="divider"><span class="line"></span><span class="star">✦</span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="tagline">Pon una sonrisa en el aire ✨</div>
    <div class="row">
      <div class="pais">🇵🇪 Distribuido por Ares Enterprise Perú</div>
      <div class="agency">DISTINTO · AGENCIA <span class="heart">♡</span></div>
    </div>
  </footer>
</div>
</body>
</html>
