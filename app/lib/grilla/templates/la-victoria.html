<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #1B4332;  /* Verde bosque oscuro (asumido) */
    --deep:      #0F2C20;
    --canvas:    #F5EDD8;  /* Crema madera natural */
    --cream:     #EFE2C2;  /* Crema más saturada */
    --white:     #FFFFFF;
    --wood:      #8B6F47;  /* Marrón madera */
    --card-cream: #FDF6E3;
    --card-wood:  #E8D4B0;
    --serif:    'Playfair Display', Georgia, serif;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--primary);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: bloques rectangulares (vetas de madera apilada) */
  .deco { position: absolute; pointer-events: none; }
  .deco.tr { top: 0; right: 0; width: 320px; height: 320px;
    background: var(--primary); opacity: .08; transform: rotate(0deg); }
  .deco.lines { position: absolute; top: 30px; right: 30px; display: flex; flex-direction: column; gap: 6px;
    opacity: .15; }
  .deco.lines span { display: block; width: 60px; height: 2px; background: var(--primary); }
  .deco.bl { bottom: -60px; left: -40px; width: 280px; height: 140px;
    background: var(--wood); opacity: .12; }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    margin: -15px -10px -15px -15px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-size: 20px; font-weight: 500; letter-spacing: 8px;
    color: var(--primary); line-height: 1; margin-bottom: 10px; text-transform: uppercase; }
  .brand-name .big { font-family: var(--serif); font-size: 70px; font-weight: 700;
    letter-spacing: -1px; color: var(--primary); line-height: .95; font-style: italic; }
  .date-pill { background: var(--primary); color: var(--canvas); font-weight: 700;
    font-size: 22px; letter-spacing: 1.5px; padding: 14px 26px; border-radius: 4px;
    white-space: nowrap; align-self: center; text-transform: uppercase; }

  .hero { text-align: center; margin: 60px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-family: var(--serif); font-style: italic; font-weight: 600;
    font-size: 148px; color: var(--primary); line-height: .92; letter-spacing: -2px; }
  .hero h1 .accent { color: var(--wood); }
  .hero .sub { font-size: 20px; font-weight: 500; color: var(--primary);
    margin-top: 22px; letter-spacing: 5px; text-transform: uppercase; opacity: .8; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-top: 22px; }
  .divider .line { width: 240px; height: 2px; background: var(--wood); }
  .divider .dot  { width: 8px; height: 8px; background: var(--wood); transform: rotate(45deg); }

  .cards { display: flex; flex-direction: column; gap: 20px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-cream)); border-radius: 2px;
    padding: 26px 36px; display: flex; align-items: center; gap: 28px;
    min-height: 140px; position: relative;
    border-left: 6px solid var(--acc, var(--primary)); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 120px; }
  .card .date .day { font-family: var(--serif); font-size: 86px; font-weight: 700;
    color: var(--primary); line-height: .9; letter-spacing: -1px; font-style: italic; }
  .card .date .month { font-size: 20px; font-weight: 600;
    color: var(--acc, var(--primary)); letter-spacing: 4px; text-transform: uppercase; margin-top: 4px; }
  .card .bar { display: none; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 30px; font-weight: 700; color: var(--primary);
    line-height: 1.15; letter-spacing: -.3px; }
  .card .body .meta { font-size: 16px; font-weight: 500; color: var(--primary);
    letter-spacing: 3px; opacity: .75; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 76px; height: 76px; color: var(--primary); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(27,67,50,.15);
    border-left: 6px dashed rgba(27,67,50,.15);
    min-height: 80px; padding: 18px 36px; }
  .card.empty .body .title { font-size: 22px; opacity: .4; }
  .card.empty .body .meta { font-size: 14px; opacity: .3; }
  .card.empty .date .day { font-size: 52px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .25; width: 44px; height: 44px; }

  .card.is-cream { --card-bg: var(--card-cream); --acc: var(--primary); }
  .card.is-wood  { --card-bg: var(--card-wood);  --acc: var(--wood); }
  .card.is-deep  { --card-bg: var(--primary);    --acc: var(--wood); color: var(--canvas); }
  .card.is-deep .body .title, .card.is-deep .date .day { color: var(--canvas); }
  .card.is-deep .body .meta { color: var(--canvas); }
  .card.is-deep .icon { color: var(--canvas); }

  .footer { margin-top: auto; padding-top: 24px; text-align: center;
    position: relative; z-index: 1; border-top: 2px solid var(--wood); }
  .footer .agency { display: inline-flex; align-items: center; gap: 14px;
    font-size: 22px; font-weight: 700; color: var(--primary);
    letter-spacing: 5px; text-transform: uppercase; margin-top: 18px; }
  .footer .url { font-size: 14px; font-weight: 400; color: var(--primary);
    margin-top: 6px; letter-spacing: 2px; opacity: .65; }
  .footer .tagline { font-family: var(--serif); font-size: 22px; font-style: italic;
    color: var(--wood); margin-bottom: 8px; }
</style>
</head>
<body>
<div class="poster">
  <div class="deco tr"></div>
  <div class="deco lines"><span></span><span></span><span></span><span></span></div>
  <div class="deco bl"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="La Victoria" />
    <div class="brand-name">
      <div class="small">Distribuidora de Pino</div>
      <div class="big">La Victoria</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <section class="hero">
    <h1>¿Qué se <span class="accent">viene?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="tagline">15 años abasteciendo la industria peruana</div>
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
