<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700;800;900&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:    #D2DD00;  /* Verde lima oficial */
    --primary-glow: #E4F000;
    --primary-deep: #A8B100;
    --black:      #1A1A1F;  /* Casi negro premium */
    --gray:       #262726;  /* Grafito oficial */
    --gray-light: #3A3A40;
    --canvas:     #131318;
    --white:      #FFFFFF;
    --card-dark:  #1F1F25;
    --card-darker: #161619;
    --display:  'Syncopate', sans-serif;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--white);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Grid técnico de fondo */
  .grid-bg { position: absolute; inset: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(210,221,0,.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(210,221,0,.04) 1px, transparent 1px);
    background-size: 80px 80px; }

  /* Spotlights LED y beams */
  .light { position: absolute; pointer-events: none; }
  .light.spot-tr { top: -250px; right: -180px; width: 700px; height: 700px;
    background: radial-gradient(circle, var(--primary) 0%, transparent 65%);
    opacity: .25; }
  .light.spot-bl { bottom: -200px; left: -150px; width: 480px; height: 480px;
    background: radial-gradient(circle, var(--primary) 0%, transparent 60%);
    opacity: .12; }
  .light.beam1 { top: 0; left: 28%; width: 2px; height: 70%;
    background: linear-gradient(180deg, var(--primary) 0%, transparent 100%);
    opacity: .35; }
  .light.beam2 { top: 0; right: 22%; width: 1px; height: 60%;
    background: linear-gradient(180deg, var(--primary) 0%, transparent 100%);
    opacity: .25; }
  .light.beam3 { top: 0; right: 38%; width: 3px; height: 80%;
    background: linear-gradient(180deg, var(--primary) 0%, transparent 100%);
    opacity: .15; }

  /* Constelación de bombillas LED (puntos brillantes) */
  .led { position: absolute; width: 6px; height: 6px; border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 12px var(--primary), 0 0 24px var(--primary);
    pointer-events: none; }
  .led.l1 { top: 220px; right: 90px; }
  .led.l2 { top: 280px; right: 180px; opacity: .6; width: 4px; height: 4px; }
  .led.l3 { top: 460px; right: 60px; opacity: .8; width: 5px; height: 5px; }
  .led.l4 { bottom: 280px; left: 80px; }
  .led.l5 { bottom: 220px; left: 160px; opacity: .5; width: 4px; height: 4px; }
  .led.l6 { top: 380px; left: 60px; opacity: .7; width: 5px; height: 5px; }

  /* HEADER */
  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 14px;
    position: relative; z-index: 2; }
  .logo { width: 160px; height: 160px; flex-shrink: 0; object-fit: contain;
    background: var(--primary); border-radius: 8px; padding: 14px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-family: var(--display); font-weight: 400; font-size: 14px;
    letter-spacing: 8px; color: var(--primary); line-height: 1; margin-bottom: 12px;
    text-transform: uppercase; }
  .brand-name .big { font-family: var(--sans); font-size: 84px; font-weight: 900;
    letter-spacing: -3px; color: var(--white); line-height: .9; }
  .brand-name .big .accent { color: var(--primary); }
  .brand-name .tag { font-family: var(--sans); font-weight: 300; font-size: 16px;
    color: var(--white); letter-spacing: 5px; text-transform: uppercase;
    margin-top: 8px; opacity: .55; }
  .date-pill { background: var(--primary); color: var(--black); font-weight: 800;
    font-size: 16px; letter-spacing: 3px; padding: 14px 22px;
    white-space: nowrap; align-self: flex-start; font-family: var(--sans);
    text-transform: uppercase; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); }

  /* Sello 15 años / garantía */
  .badge-warranty { position: absolute; top: 300px; left: 60px; z-index: 2;
    background: var(--canvas); border: 2px solid var(--primary);
    padding: 16px 22px; transform: rotate(-4deg);
    box-shadow: 0 8px 20px rgba(210,221,0,.2); }
  .badge-warranty .num { font-family: var(--sans); font-size: 42px; font-weight: 900;
    color: var(--primary); line-height: 1; letter-spacing: -2px; }
  .badge-warranty .label { font-family: var(--sans); font-size: 11px; font-weight: 700;
    color: var(--white); letter-spacing: 3px; text-transform: uppercase; margin-top: 2px; }
  .badge-warranty .sub { font-family: var(--sans); font-size: 9px; font-weight: 500;
    color: var(--primary); letter-spacing: 2px; text-transform: uppercase;
    margin-top: 4px; opacity: .8; }

  /* HERO */
  .hero { text-align: center; margin: 70px 0 50px; position: relative; z-index: 2; }
  .hero h1 { font-family: var(--sans); font-weight: 900; font-size: 178px;
    color: var(--white); line-height: .85; letter-spacing: -7px; }
  .hero h1 .accent { color: var(--primary);
    text-shadow: 0 0 40px rgba(210,221,0,.4); }
  .hero .sub { font-family: var(--display); font-weight: 400; font-size: 16px;
    color: var(--primary); margin-top: 22px; letter-spacing: 8px;
    text-transform: uppercase; }
  .hero .tag-hero { font-family: var(--sans); font-weight: 300; font-style: italic;
    font-size: 22px; color: var(--white); margin-top: 8px; opacity: .65; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 18px; margin-top: 22px; }
  .divider .line { width: 80px; height: 1px; background: var(--primary); }
  .divider .led-dot { width: 8px; height: 8px; background: var(--primary);
    border-radius: 50%; box-shadow: 0 0 12px var(--primary); }

  /* CARDS */
  .cards { display: flex; flex-direction: column; gap: 14px; margin-top: 6px;
    position: relative; z-index: 2; }
  .card { background: var(--card-bg, var(--card-dark)); border-radius: 6px;
    padding: 22px 28px; display: flex; align-items: center; gap: 24px;
    min-height: 130px; position: relative;
    border-left: 3px solid var(--acc, var(--primary));
    box-shadow: 0 4px 16px rgba(0,0,0,.4); }
  .card::before { content: ''; position: absolute; top: 0; right: 16px; width: 30px;
    height: 3px; background: var(--acc, var(--primary)); }
  .card::after { content: ''; position: absolute; top: 14px; right: 18px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--acc, var(--primary));
    box-shadow: 0 0 8px var(--acc, var(--primary)); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 100px;
    border-right: 1px solid rgba(255,255,255,.08); padding-right: 22px; }
  .card .date .day { font-family: var(--sans); font-size: 84px; font-weight: 900;
    color: var(--white); line-height: .85; letter-spacing: -3px; }
  .card .date .month { font-family: var(--display); font-size: 12px; font-weight: 400;
    color: var(--acc, var(--primary)); letter-spacing: 4px;
    text-transform: uppercase; margin-top: 4px; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-family: var(--sans); font-size: 30px; font-weight: 700;
    color: var(--white); line-height: 1.1; letter-spacing: -.3px; }
  .card .body .meta { font-family: var(--sans); font-size: 11px; font-weight: 800;
    color: var(--primary); letter-spacing: 4px; text-transform: uppercase; opacity: .8; }
  .card .icon { flex-shrink: 0; width: 68px; height: 68px; color: var(--primary);
    background: rgba(210,221,0,.1); border-radius: 6px; padding: 14px;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(210,221,0,.25); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 1.5px dashed rgba(255,255,255,.08);
    border-left: 3px dashed rgba(210,221,0,.3); min-height: 74px; padding: 12px 28px;
    box-shadow: none; }
  .card.empty::before, .card.empty::after { display: none; }
  .card.empty .body .title { font-size: 16px; font-weight: 400; opacity: .35; }
  .card.empty .body .meta { display: none; }
  .card.empty .date { border: none; }
  .card.empty .date .day { font-size: 48px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .15; background: transparent; border: none; padding: 0; }

  .card.is-dark  { --card-bg: var(--card-dark);    --acc: var(--primary); }
  .card.is-light { --card-bg: var(--card-darker);  --acc: var(--white); }
  .card.is-lime  { --card-bg: var(--primary);      --acc: var(--black); }
  .card.is-lime .date .day, .card.is-lime .body .title { color: var(--black); }
  .card.is-lime .body .meta { color: var(--black); opacity: .85; }
  .card.is-lime .date { border-right-color: rgba(0,0,0,.2); }
  .card.is-lime .icon { background: rgba(0,0,0,.1); border-color: rgba(0,0,0,.2); color: var(--black); }

  /* FOOTER */
  .footer { margin-top: auto; padding-top: 22px; position: relative; z-index: 2;
    border-top: 1px solid var(--primary); }
  .footer .row { display: flex; align-items: center; justify-content: space-between; padding-top: 14px; }
  .footer .left { display: flex; flex-direction: column; gap: 4px; }
  .footer .tagline { font-family: var(--sans); font-weight: 700; font-size: 22px;
    color: var(--white); letter-spacing: -.3px; }
  .footer .web { font-family: var(--display); font-size: 11px; font-weight: 400;
    color: var(--primary); letter-spacing: 3px; }
  .footer .agency { display: inline-flex; align-items: center; gap: 12px;
    font-family: var(--display); font-size: 14px; font-weight: 700; color: var(--white);
    letter-spacing: 5px; text-transform: uppercase; }
  .footer .agency .led-dot { width: 6px; height: 6px; background: var(--primary);
    border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
</style>
</head>
<body>
<div class="poster">
  <div class="grid-bg"></div>
  <div class="light spot-tr"></div>
  <div class="light spot-bl"></div>
  <div class="light beam1"></div>
  <div class="light beam2"></div>
  <div class="light beam3"></div>
  <span class="led l1"></span>
  <span class="led l2"></span>
  <span class="led l3"></span>
  <span class="led l4"></span>
  <span class="led l5"></span>
  <span class="led l6"></span>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Novalamps" />
    <div class="brand-name">
      <div class="small">Iluminación LED · Premium</div>
      <div class="big">Nova<span class="accent">lamps</span></div>
      <div class="tag">Diseño · Garantía · Showroom Surco</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <div class="badge-warranty">
    <div class="num">15+</div>
    <div class="label">Años</div>
    <div class="sub">— Garantía real —</div>
  </div>

  <section class="hero">
    <h1>¿QUÉ SE<br><span class="accent">VIENE?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="tag-hero">— iluminación de la semana —</div>
    <div class="divider"><span class="line"></span><span class="led-dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="row">
      <div class="left">
        <div class="tagline">Convierte cada espacio en diseño</div>
        <div class="web">NOVALAMPS.COM.PE · AV. CAMINOS DEL INCA 1457</div>
      </div>
      <div class="agency"><span class="led-dot"></span>DISTINTO · AGENCIA<span class="led-dot"></span></div>
    </div>
  </footer>
</div>
</body>
</html>
