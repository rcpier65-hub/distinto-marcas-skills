<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --primary:   #D2DD00;  /* Verde lima oficial Novalamps */
    --primary-glow: #E4F000;
    --black:     #262726;  /* Grafito oficial */
    --gray:      #444444;
    --canvas:    #1A1A1A;  /* Casi negro (mood iluminación) */
    --white:     #FFFFFF;
    --card-dark:  #2A2A2A;
    --card-lighter: #353535;
    --sans:     'Inter', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #2c2c2c; font-family: var(--sans); color: var(--white);
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  body { display: flex; justify-content: center; padding: 0; margin: 0; }
  .poster { width: 1080px; height: 1620px; background: var(--canvas); position: relative;
    overflow: hidden; padding: 70px 80px 55px; display: flex; flex-direction: column; }

  /* Decoración: rayos de luz / haces LED */
  .light { position: absolute; pointer-events: none; }
  .light.glow { top: -200px; right: -100px; width: 500px; height: 500px;
    background: radial-gradient(circle, var(--primary) 0%, transparent 65%);
    opacity: .35; }
  .light.beam { top: 0; right: 20%; width: 3px; height: 100%;
    background: linear-gradient(180deg, var(--primary) 0%, transparent 80%);
    opacity: .25; }
  .light.beam2 { top: 0; left: 30%; width: 2px; height: 100%;
    background: linear-gradient(180deg, transparent 30%, var(--primary) 70%, transparent 100%);
    opacity: .2; }
  .light.bottom { bottom: -100px; left: -50px; width: 380px; height: 380px;
    background: radial-gradient(circle, var(--primary) 0%, transparent 60%);
    opacity: .2; }

  .header { display: flex; align-items: center; gap: 24px; margin-bottom: 10px;
    position: relative; z-index: 1; }
  .logo { width: 170px; height: 170px; flex-shrink: 0; object-fit: contain;
    margin: -15px -10px -15px -15px; }
  .brand-name { flex: 1; }
  .brand-name .small { font-size: 22px; font-weight: 300; letter-spacing: 5px;
    color: var(--primary); line-height: 1; margin-bottom: 10px; text-transform: uppercase; }
  .brand-name .big { font-size: 76px; font-weight: 800; letter-spacing: -2px;
    color: var(--white); line-height: .9; }
  .date-pill { background: var(--primary); color: var(--black); font-weight: 800;
    font-size: 22px; letter-spacing: 1.5px; padding: 14px 26px;
    white-space: nowrap; align-self: center; text-transform: uppercase; }

  .hero { text-align: center; margin: 60px 0 50px; position: relative; z-index: 1; }
  .hero h1 { font-size: 168px; font-weight: 900; color: var(--white);
    line-height: .88; letter-spacing: -6px; }
  .hero h1 .accent { color: var(--primary); }
  .hero .sub { font-size: 22px; font-weight: 400; color: var(--primary);
    margin-top: 22px; letter-spacing: 4px; text-transform: uppercase; }
  .divider { display: flex; align-items: center; justify-content: center;
    gap: 16px; margin-top: 22px; }
  .divider .line { width: 220px; height: 2px; background: var(--primary); }
  .divider .dot  { width: 10px; height: 10px; background: var(--primary); }

  .cards { display: flex; flex-direction: column; gap: 20px; margin-top: 10px;
    position: relative; z-index: 1; }
  .card { background: var(--card-bg, var(--card-dark)); border-radius: 4px;
    padding: 26px 34px; display: flex; align-items: center; gap: 28px;
    min-height: 140px; position: relative;
    border-left: 4px solid var(--acc, var(--primary)); }
  .card .date { flex-shrink: 0; text-align: left; min-width: 120px; }
  .card .date .day { font-size: 88px; font-weight: 900; color: var(--white);
    line-height: .85; letter-spacing: -3px; }
  .card .date .month { font-size: 20px; font-weight: 700;
    color: var(--acc, var(--primary)); letter-spacing: 3px; text-transform: uppercase; margin-top: 4px; }
  .card .bar { display: none; }
  .card .body { flex: 1; display: flex; flex-direction: column; gap: 6px; }
  .card .body .title { font-size: 34px; font-weight: 700; color: var(--white);
    line-height: 1.1; letter-spacing: -.3px; }
  .card .body .meta { font-size: 16px; font-weight: 500; color: var(--primary);
    letter-spacing: 2px; opacity: .8; text-transform: uppercase; }
  .card .icon { flex-shrink: 0; width: 76px; height: 76px; color: var(--primary); }
  .card .icon svg { width: 100%; height: 100%; stroke: currentColor; fill: none;
    stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .card.empty { background: transparent; border: 2px dashed rgba(255,255,255,.1);
    border-left: 4px dashed rgba(210,221,0,.3);
    min-height: 80px; padding: 18px 34px; }
  .card.empty .body .title { font-size: 22px; opacity: .35; }
  .card.empty .body .meta { font-size: 14px; opacity: .3; }
  .card.empty .date .day { font-size: 52px; opacity: .3; }
  .card.empty .date .month { opacity: .3; }
  .card.empty .icon { opacity: .2; width: 44px; height: 44px; }

  .card.is-dark  { --card-bg: var(--card-dark);   --acc: var(--primary); }
  .card.is-light { --card-bg: var(--card-lighter); --acc: var(--white); }
  .card.is-lime  { --card-bg: var(--primary);     --acc: var(--black); }
  .card.is-lime .body .title, .card.is-lime .date .day { color: var(--black); }
  .card.is-lime .body .meta, .card.is-lime .date .month { color: var(--black); opacity: .9; }
  .card.is-lime .icon { color: var(--black); }

  .footer { margin-top: auto; padding-top: 24px; text-align: center;
    position: relative; z-index: 1; border-top: 1px solid var(--primary); }
  .footer .agency { display: inline-flex; align-items: center; gap: 14px;
    font-size: 24px; font-weight: 800; color: var(--white);
    letter-spacing: 5px; text-transform: uppercase; margin-top: 18px; }
  .footer .url { font-size: 14px; font-weight: 300; color: var(--primary);
    margin-top: 6px; letter-spacing: 2px; opacity: .7; }
  .footer .tagline { font-size: 14px; font-weight: 400; color: var(--primary);
    letter-spacing: 5px; text-transform: uppercase; margin-bottom: 8px; }
</style>
</head>
<body>
<div class="poster">
  <div class="light glow"></div>
  <div class="light beam"></div>
  <div class="light beam2"></div>
  <div class="light bottom"></div>

  <header class="header">
    <img class="logo" src="{{LOGO_URL}}" alt="Novalamps" />
    <div class="brand-name">
      <div class="small">Iluminación · Diseño · Garantía</div>
      <div class="big">Novalamps</div>
    </div>
    <div class="date-pill">{{DATE_PILL}}</div>
  </header>

  <section class="hero">
    <h1>¿QUÉ SE<br><span class="accent">VIENE?</span></h1>
    <div class="sub">{{DATE_SUB}}</div>
    <div class="divider"><span class="line"></span><span class="dot"></span><span class="line"></span></div>
  </section>

  <section class="cards">
    {{CARDS_HTML}}
  </section>

  <footer class="footer">
    <div class="tagline">Convierte cada espacio en diseño</div>
    <div class="agency">DISTINTO · AGENCIA</div>
    <div class="url">www.agenciadistinto.com</div>
  </footer>
</div>
</body>
</html>
