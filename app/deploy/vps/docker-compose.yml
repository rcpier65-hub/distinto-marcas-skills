# App de la agencia en el KVM 4 → https://app.distintostudio.com
# (No confundir con /docker/distinto, que es otra app.)
services:
  app:
    image: distinto-agencia:prod
    container_name: distinto-agencia
    restart: unless-stopped
    env_file: ./app.env
    environment:
      FINANCE_TRANSCRIBER_URL: http://transcriptor:9000/asr
    ports:
      - "127.0.0.1:8120:3000"
    # Tope de recursos para no quitarle rendimiento a las otras apps del VPS.
    cpus: "2.0"
    mem_limit: 2g
    networks:
      - default
      - supabase
      - transcriptor
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=distinto-agencia_default"
      - "traefik.http.routers.distinto-agencia.entrypoints=websecure"
      - "traefik.http.routers.distinto-agencia.rule=Host(`app.distintostudio.com`)"
      - "traefik.http.routers.distinto-agencia.tls.certresolver=letsencrypt"
      - "traefik.http.routers.distinto-recursos-www.entrypoints=websecure"
      - "traefik.http.routers.distinto-recursos-www.rule=Host(`www.distintostudio.com`) && (PathPrefix(`/recursos`) || PathPrefix(`/_next`) || PathPrefix(`/agencia`) || Path(`/api/recursos/lead`))"
      - "traefik.http.routers.distinto-recursos-www.priority=100"
      - "traefik.http.routers.distinto-recursos-www.service=distinto-agencia"
      - "traefik.http.routers.distinto-recursos-www.tls.certresolver=letsencrypt"
      - "traefik.http.services.distinto-agencia.loadbalancer.server.port=3000"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    security_opt:
      - no-new-privileges:true

networks:
  transcriptor:
    external: true
    name: transcriptor_net
  supabase:
    external: true
    name: distinto-agencia-supabase_default
