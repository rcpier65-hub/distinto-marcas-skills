name: Cron — Procesar grillas pendientes

# GitHub Actions cron como reemplazo de Vercel cron
# (Vercel Hobby Free no permite >1×/día).
#
# Corre cada 5 min lun-vie 12:00-23:00 UTC (= 7:00-18:00 Lima -5h).
# GitHub Actions cron tiene drift de 5-15 min en horarios de alta carga,
# pero suficiente para nuestro caso (notificación tolera latencia).
#
# Requiere secret en repo settings:
#   CRON_SECRET = mismo valor que el env var de Vercel
#
# Manual trigger: Actions tab → workflow → Run workflow

on:
  schedule:
    # cron syntax: minute hour day-of-month month day-of-week
    - cron: '*/5 12-23 * * 1-5'
  workflow_dispatch:  # permite trigger manual desde UI

jobs:
  procesar:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call Vercel cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ENDPOINT_URL: https://distinto-app.vercel.app/api/cron/procesar-pendientes
        run: |
          set -e
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ENDPOINT_URL")
          body=$(echo "$response" | head -n -1)
          status=$(echo "$response" | tail -n 1)
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Cron endpoint returned non-200 status"
            exit 1
          fi
